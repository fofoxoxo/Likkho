<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Likkho" />
    <title>Likkho</title>
    <meta name="description" content="Likkho — Wikipedia-style writing and diary app." />
    <meta property="og:title" content="Likkho" />
    <meta property="og:description" content="Likkho — Wikipedia-style writing and diary app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('wikilog_theme_mode_v2') || (localStorage.getItem('wikilog_dark_theme_v1') === 'true' ? 'dark_charcoal' : 'system');
          var isSystemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effective = savedTheme === 'system' ? (isSystemDark ? 'dark_charcoal' : 'light') : savedTheme;
          var bgMap = {
            light: '#ffffff',
            dark_charcoal: '#101418',
            amoled: '#000000',
            grayscale: '#e5e7eb',
            eink: '#f6f3e9',
            tinted_cool: '#eef3f9',
            tinted_warm: '#f9f2ea'
          };
          var bg = bgMap[effective] || '#ffffff';
          document.documentElement.setAttribute('data-theme', effective);
          if (effective === 'dark_charcoal' || effective === 'amoled') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.backgroundColor = bg;
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body class="overscroll-none select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
