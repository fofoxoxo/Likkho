              private boolean isLikelyLikkhoArchiveIntent(Intent intent, Uri candidateUri) {
                  String mime = intent.getType() != null ? intent.getType().toLowerCase() : "";
                  if (mime.contains("likkho")) return true;
                  if (candidateUri != null) {
                      String uriStr = candidateUri.toString().toLowerCase();
                      if (uriStr.endsWith(".likkho")) return true;
                      try (Cursor c = getContentResolver().query(candidateUri, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null)) {
                          if (c != null && c.moveToFirst()) {
                              String name = c.getString(0);
                              if (name != null && name.toLowerCase().endsWith(".likkho")) {
                                  return true;
                              }
                          }
                      } catch (Exception ignored) {}
                  }
                  return false;
              }

              private String decodeAndCompressSharedImageToDataUrl(Uri uri) {
                  if (uri == null) return "";
                  BitmapFactory.Options boundsOpts = new BitmapFactory.Options();
                  boundsOpts.inJustDecodeBounds = true;
                  try (InputStream is1 = getContentResolver().openInputStream(uri)) {
                      if (is1 == null) return "";
                      BitmapFactory.decodeStream(is1, null, boundsOpts);
                  } catch (Exception e) {
                      return "";
                  }
                  int srcW = boundsOpts.outWidth;
                  int srcH = boundsOpts.outHeight;
                  if (srcW <= 0 || srcH <= 0) return "";

                  int inSampleSize = 1;
                  final int maxDim = 2560;
                  while ((srcW / inSampleSize) > maxDim * 2 || (srcH / inSampleSize) > maxDim * 2) {
                      inSampleSize *= 2;
                  }

                  BitmapFactory.Options decodeOpts = new BitmapFactory.Options();
                  decodeOpts.inSampleSize = inSampleSize;
                  Bitmap decoded = null;
                  try (InputStream is2 = getContentResolver().openInputStream(uri)) {
                      if (is2 == null) return "";
                      decoded = BitmapFactory.decodeStream(is2, null, decodeOpts);
                  } catch (Exception e) {
                      return "";
                  }
                  if (decoded == null) return "";

                  Bitmap finalBmp = decoded;
                  try {
                      int curW = decoded.getWidth();
                      int curH = decoded.getHeight();
                      int maxSide = Math.max(curW, curH);
                      if (maxSide > maxDim) {
                          float ratio = (float) maxDim / (float) maxSide;
                          int dstW = Math.max(1, Math.round(curW * ratio));
                          int dstH = Math.max(1, Math.round(curH * ratio));
                          finalBmp = Bitmap.createScaledBitmap(decoded, dstW, dstH, true);
                      }
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      finalBmp.compress(Bitmap.CompressFormat.JPEG, 88, baos);
                      byte[] jpegBytes = baos.toByteArray();
                      return "data:image/jpeg;base64," + Base64.encodeToString(jpegBytes, Base64.NO_WRAP);
                  } catch (Exception e) {
                      return "";
                  } finally {
                      if (finalBmp != null && finalBmp != decoded) {
                          finalBmp.recycle();
                      }
                      decoded.recycle();
                  }
              }

              private void handleIncomingLikkhoIntent(Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  if (!Intent.ACTION_VIEW.equals(action) && !Intent.ACTION_EDIT.equals(action) && !Intent.ACTION_SEND.equals(action)) {
                      return;
                  }
                  Uri dataUri = intent.getData();
                  Uri streamUri = Intent.ACTION_SEND.equals(action) ? intent.getParcelableExtra(Intent.EXTRA_STREAM) : null;
                  if (streamUri == null && Intent.ACTION_SEND.equals(action) && intent.getClipData() != null && intent.getClipData().getItemCount() > 0) {
                      streamUri = intent.getClipData().getItemAt(0).getUri();
                  }
                  Uri candidateUri = dataUri != null ? dataUri : streamUri;

                  // 1. Handle Share-to-Likkho (text/plain or image/* from Gallery, Chrome, WhatsApp, etc.)
                  if (Intent.ACTION_SEND.equals(action) && !isLikelyLikkhoArchiveIntent(intent, candidateUri)) {
                      String subjectExtra = intent.getStringExtra(Intent.EXTRA_SUBJECT);
                      if (subjectExtra == null || subjectExtra.trim().isEmpty()) {
                          subjectExtra = intent.getStringExtra(Intent.EXTRA_TITLE);
                      }
                      CharSequence textCs = intent.getCharSequenceExtra(Intent.EXTRA_TEXT);
                      String textExtra = textCs != null ? textCs.toString() : intent.getStringExtra(Intent.EXTRA_TEXT);
                      final String finalTitle = subjectExtra != null ? subjectExtra : "";
                      final String finalText = textExtra != null ? textExtra : "";
                      final Uri finalImageUri = candidateUri;

                      if (finalTitle.isEmpty() && finalText.isEmpty() && finalImageUri == null) {
                          return;
                      }

                      new Thread(() -> {
                          try {
                              String imageDataUrl = finalImageUri != null ? decodeAndCompressSharedImageToDataUrl(finalImageUri) : "";
                              if (finalTitle.isEmpty() && finalText.isEmpty() && imageDataUrl.isEmpty()) {
                                  return;
                              }
                              JSONObject payload = new JSONObject();
                              payload.put("title", finalTitle);
                              payload.put("text", finalText);
                              payload.put("imageDataUrl", imageDataUrl);
                              pendingIncomingShareJson = payload.toString();
                              notifyWebViewShareAvailable();
                          } catch (Exception ignored) {}
                      }).start();
                      return;
                  }

                  // 2. Existing .likkho archive file unpack flow
                  if (candidateUri == null) return;
                  final Uri targetUri = candidateUri;
                  new Thread(() -> {
                      try (InputStream is = getContentResolver().openInputStream(targetUri)) {
                          if (is == null) return;
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          byte[] buf = new byte[8192];
                          int r;
                          while ((r = is.read(buf)) != -1) {
                              baos.write(buf, 0, r);
                          }
                          byte[] rawBytes = baos.toByteArray();
                          if (rawBytes.length == 0) return;

                          final String b64 = Base64.encodeToString(rawBytes, Base64.NO_WRAP);
                          pendingIncomingLikkhoBase64 = b64;
                          intent.setData(null);

                          runOnUiThread(() -> {
                              if (bridge != null && bridge.getWebView() != null) {
                                  bridge.getWebView().postDelayed(() -> {
                                      if (pendingIncomingLikkhoBase64 != null && bridge != null && bridge.getWebView() != null) {
                                          final String payloadToDeliver = pendingIncomingLikkhoBase64;
                                          bridge.getWebView().evaluateJavascript(
                                              "(function(){ if(window.__onLikkhoIncomingArchive){ window.__onLikkhoIncomingArchive('" + payloadToDeliver + "'); return 'DELIVERED'; } return 'PENDING'; })()",
                                              val -> {
                                                  if (val != null && val.contains("DELIVERED")) {
                                                      pendingIncomingLikkhoBase64 = null;
                                                  }
                                              }
                                          );
                                      }
                                  }, 450);
                              }
                          });
                      } catch (Exception ignored) {}
                  }).start();
              }

              private void handleQuickNoteIntent(Intent intent) {
                  if (intent == null) return;
                  if ("quick_note".equals(intent.getStringExtra("action")) ||
                      "com.likkho.diary.ACTION_QUICK_NOTE".equals(intent.getAction()) ||
                      (intent.getData() != null && "quick_note".equals(intent.getData().getQueryParameter("action")))) {
                      pendingCloseAfterQuickNoteNotif = false;
                      pendingQuickNoteLaunch = true;
                      intent.setAction(Intent.ACTION_MAIN);
                      intent.removeExtra("action");
                      intent.setData(null);
                      try {
                          if (activeBiometricCancelSignal != null && !activeBiometricCancelSignal.isCanceled()) {
                              activeBiometricCancelSignal.cancel();
                          }
                          activeBiometricCancelSignal = null;
                      } catch (Exception ignored) {}
                      notifyWebViewQuickNoteLaunch();
                  } else if ("new_diary".equals(intent.getStringExtra("action")) ||
                      "com.likkho.diary.ACTION_NEW_DIARY".equals(intent.getAction()) ||
                      (intent.getData() != null && "new_diary".equals(intent.getData().getQueryParameter("action")))) {
                      pendingNewDiaryLaunch = true;
                      intent.setAction(Intent.ACTION_MAIN);
                      intent.removeExtra("action");
                      intent.setData(null);
                      notifyWebViewNewDiaryLaunch();
                  }
              }

