              private void applyWindowSystemBarsColor(final String statusBarHex, final String navBarHex, final boolean darkIconsOnLightBar) {
                  currentStatusBarHex = statusBarHex != null ? statusBarHex : "#f8f9fa";
                  currentNavBarHex = navBarHex != null ? navBarHex : "#ffffff";
                  currentDarkIconsOnLightBar = darkIconsOnLightBar;
                  getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
                      .edit()
                      .putString(KEY_STATUS_BAR_HEX, currentStatusBarHex)
                      .putString(KEY_NAV_BAR_HEX, currentNavBarHex)
                      .putBoolean(KEY_DARK_ICONS_ON_LIGHT, currentDarkIconsOnLightBar)
                      .apply();

                  runOnUiThread(() -> {
                      try {
                          android.view.Window window = getWindow();
                          if (window == null) return;
                          android.view.View decor = window.getDecorView();
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              decor.setForceDarkAllowed(false);
                          }
                          WindowCompat.setDecorFitsSystemWindows(window, !isFullScreenEnabled);
                          window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                          window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_TRANSLUCENT_NAVIGATION);
                          window.addFlags(android.view.WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);

                          int statusColor = android.graphics.Color.parseColor(currentStatusBarHex);
                          int navColor = android.graphics.Color.parseColor(currentNavBarHex);
                          window.setStatusBarColor(statusColor);
                          window.setNavigationBarColor(navColor);
                          window.setBackgroundDrawable(new android.graphics.drawable.ColorDrawable(navColor));
                          decor.setBackgroundColor(navColor);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              window.setNavigationBarDividerColor(navColor);
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              window.setStatusBarContrastEnforced(false);
                              window.setNavigationBarContrastEnforced(false);
                          }

                          WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, decor);
                          if (controller != null) {
                              controller.setAppearanceLightStatusBars(currentDarkIconsOnLightBar);
                              controller.setAppearanceLightNavigationBars(currentDarkIconsOnLightBar);
                          }

                          int sysUiVis = decor.getSystemUiVisibility();
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              if (currentDarkIconsOnLightBar) {
                                  sysUiVis |= android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                              } else {
                                  sysUiVis &= ~android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                              }
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              if (currentDarkIconsOnLightBar) {
                                  sysUiVis |= android.view.View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                              } else {
                                  sysUiVis &= ~android.view.View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                              }
                          }
                          decor.setSystemUiVisibility(sysUiVis);

                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().setBackgroundColor(navColor);
                          }
                      } catch (Exception ignored) {}
                  });
              }

              private void applyWindowFullScreenMode(final boolean enabled) {
                  isFullScreenEnabled = enabled;
                  getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
                      .edit()
                      .putBoolean(KEY_FULLSCREEN_ENABLED, enabled)
                      .apply();
                  runOnUiThread(() -> {
                      try {
                          android.view.Window window = getWindow();
                          if (window == null) return;
                          android.view.View decor = window.getDecorView();
                          WindowCompat.setDecorFitsSystemWindows(window, !enabled);
                          WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, decor);
                          if (controller != null) {
                              if (enabled) {
                                  controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                                  controller.hide(androidx.core.view.WindowInsetsCompat.Type.systemBars());
                              } else {
                                  controller.show(androidx.core.view.WindowInsetsCompat.Type.systemBars());
                              }
                          }
                          if (enabled) {
                              window.addFlags(android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN);
                          } else {
                              window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN);
                              applyWindowSystemBarsColor(currentStatusBarHex, currentNavBarHex, currentDarkIconsOnLightBar);
                          }
                      } catch (Exception ignored) {}
                  });
              }

