              private final Handler audioProgressHandler = new Handler(Looper.getMainLooper());
              private final Runnable audioProgressRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (nativeMediaPlayer != null && activeAudioId != null) {
                          try {
                              boolean playing = nativeMediaPlayer.isPlaying();
                              int posMs = nativeMediaPlayer.getCurrentPosition();
                              int durMs = nativeMediaPlayer.getDuration();
                              emitNativeAudioProgress(activeAudioId, posMs / 1000.0, Math.max(0, durMs) / 1000.0, playing, false);
