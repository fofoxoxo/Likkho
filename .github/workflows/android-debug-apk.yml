                  @JavascriptInterface
                  public boolean beginSafBackupStream(String vaultMode) {
                      pendingVaultMode = (vaultMode != null && !vaultMode.isEmpty()) ? vaultMode : "primary";
                      Uri treeUri = getPersistedSafTreeUri(pendingVaultMode);
                      if (treeUri == null) {
                          launchSafDirectoryPicker(SAF_OP_BACKUP);
                          return false;
                      }
                      try {
                          final String targetSubfolder = getSubfolderForMode(pendingVaultMode);
                          final String targetFilename = getVaultFilenameForMode(pendingVaultMode);
                          final String tmpFilename = targetFilename + ".tmp";
                          ContentResolver resolver = getContentResolver();
                          String rootDocId = DocumentsContract.getTreeDocumentId(treeUri);
                          String backupDirDocId = getOrCreateChildDirectory(treeUri, rootDocId, targetSubfolder);
                          ensureNomediaInSafFolder(treeUri, backupDirDocId);

                          // Delete previous interrupted .tmp file if it exists
                          String oldTmpDocId = findChildDocumentId(treeUri, backupDirDocId, tmpFilename);
                          if (oldTmpDocId != null) {
                              try {
                                  DocumentsContract.deleteDocument(resolver, DocumentsContract.buildDocumentUriUsingTree(treeUri, oldTmpDocId));
                              } catch (Exception ignored) {}
                          }

                          Uri backupDirUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, backupDirDocId);
                          Uri tmpFileUri = DocumentsContract.createDocument(
                              resolver,
                              backupDirUri,
                              "application/octet-stream",
                              tmpFilename
                          );
                          if (tmpFileUri == null) return false;

                          if (activeSafBackupStream != null) {
                              try { activeSafBackupStream.close(); } catch (Exception ignored) {}
                          }
                          activeSafBackupStream = resolver.openOutputStream(tmpFileUri, "wt");
                          if (activeSafBackupStream == null) {
                              try { DocumentsContract.deleteDocument(resolver, tmpFileUri); } catch (Exception ignored) {}
                              return false;
                          }

                          activeSafTmpUri = tmpFileUri;
                          activeSafVaultMode = pendingVaultMode;
                          activeSafTargetFilename = targetFilename;
                          activeSafTreeUri = treeUri;
                          activeSafBackupDirDocId = backupDirDocId;
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean appendSafBackupChunk(String base64Chunk) {
                      if (activeSafBackupStream == null || base64Chunk == null) return false;
                      try {
                          byte[] bytes = Base64.decode(base64Chunk, Base64.NO_WRAP);
                          activeSafBackupStream.write(bytes);
                          return true;
                      } catch (Exception e) {
                          cancelSafBackupStream();
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void finishSafBackupStream() {
                      if (activeSafBackupStream == null) {
                          notifySafBackupResult(false, "No active backup stream to finish.");
                          return;
                      }

                      ContentResolver resolver = getContentResolver();

                      // 1. Check flush() and close() errors
                      try {
                          activeSafBackupStream.flush();
                          activeSafBackupStream.close();
                      } catch (Exception closeEx) {
                          activeSafBackupStream = null;
                          if (activeSafTmpUri != null) {
                              try {
                                  DocumentsContract.deleteDocument(resolver, activeSafTmpUri);
                              } catch (Exception ignored) {}
                              activeSafTmpUri = null;
                          }
                          notifySafBackupResult(false, "Failed to flush/close backup stream: " + closeEx.getMessage());
                          return;
                      }
                      activeSafBackupStream = null;

                      // 2. Safe replace: rename old to .bak, rename .tmp to final, then delete .bak
                      if (activeSafTmpUri != null && activeSafTreeUri != null && activeSafBackupDirDocId != null && activeSafTargetFilename != null) {
                          final String bakFilename = activeSafTargetFilename + ".bak";
                          Uri bakUri = null;

                          try {
                              // If an old .bak exists from any previous crashed attempt, clean it up
                              String oldBakDocId = findChildDocumentId(activeSafTreeUri, activeSafBackupDirDocId, bakFilename);
                              if (oldBakDocId != null) {
                                  try {
                                      DocumentsContract.deleteDocument(resolver, DocumentsContract.buildDocumentUriUsingTree(activeSafTreeUri, oldBakDocId));
                                  } catch (Exception ignored) {}
                              }

                              // Find existing old backup file
                              String existingDocId = findChildDocumentId(activeSafTreeUri, activeSafBackupDirDocId, activeSafTargetFilename);
                              if (existingDocId != null) {
                                  Uri existingUri = DocumentsContract.buildDocumentUriUsingTree(activeSafTreeUri, existingDocId);
                                  bakUri = DocumentsContract.renameDocument(resolver, existingUri, bakFilename);
                              }

                              // Rename .tmp to final target backup filename
                              Uri finalUri = DocumentsContract.renameDocument(resolver, activeSafTmpUri, activeSafTargetFilename);

                              if (finalUri != null) {
                                  // Success! Delete .bak now
                                  if (bakUri != null) {
                                      try {
                                          DocumentsContract.deleteDocument(resolver, bakUri);
                                      } catch (Exception ignored) {}
                                  }
                                  cachedSafBackupUriMap.put(activeSafVaultMode, finalUri);
                                  activeSafTmpUri = null;

                                  Uri treeUri = getPersistedSafTreeUri(activeSafVaultMode);
                                  String folder = treeUri != null ? extractSafFolderDisplayName(treeUri) : "SAF";
                                  notifySafBackupResult(true, "Backup saved in " + folder + "/" + getSubfolderForMode(activeSafVaultMode) + "/" + getVaultFilenameForMode(activeSafVaultMode));
                                  return;
                              } else {
                                  throw new Exception("DocumentsContract.renameDocument returned null for tmp file");
                              }
                          } catch (Exception renameEx) {
                              // Rollback: restore .bak to original filename, delete .tmp, notify failure
                              if (bakUri != null) {
                                  try {
                                      DocumentsContract.renameDocument(resolver, bakUri, activeSafTargetFilename);
                                  } catch (Exception ignored) {}
                              }
                              if (activeSafTmpUri != null) {
                                  try {
                                      DocumentsContract.deleteDocument(resolver, activeSafTmpUri);
                                  } catch (Exception ignored) {}
                                  activeSafTmpUri = null;
                              }
                              cachedSafBackupUriMap.remove(activeSafVaultMode);
                              notifySafBackupResult(false, "Failed to finalize backup file: " + renameEx.getMessage());
                              return;
                          }
                      }

                      notifySafBackupResult(false, "Backup state invalid during finish.");
                  }

                  @JavascriptInterface
                  public void cancelSafBackupStream() {
                      if (activeSafBackupStream != null) {
                          try { activeSafBackupStream.close(); } catch (Exception ignored) {}
                          activeSafBackupStream = null;
                      }
                      if (activeSafTmpUri != null) {
                          try {
                              DocumentsContract.deleteDocument(getContentResolver(), activeSafTmpUri);
                          } catch (Exception ignored) {}
                          activeSafTmpUri = null;
                      }
                  }

                  private synchronized Uri resolveSafBackupFileUri(String mode) {
                      Uri cached = cachedSafBackupUriMap.get(mode);
                      if (cached != null) {
                          try (android.content.res.AssetFileDescriptor afd = getContentResolver().openAssetFileDescriptor(cached, "r")) {
                              if (afd != null) return cached;
                          } catch (Exception e) {
                              cachedSafBackupUriMap.remove(mode);
                          }
                      }

                      Uri treeUri = getPersistedSafTreeUri(mode);
                      if (treeUri == null) return null;
                      try {
                          String targetSubfolder = getSubfolderForMode(mode);
                          String[] candidateFileNames = "decoy".equalsIgnoreCase(mode)
                              ? new String[]{DECOY_VAULT_FILENAME}
                              : new String[]{PRIMARY_VAULT_FILENAME, LEGACY_JSON_FILENAME, LEGACY_VAULT_FILENAME};
                          ContentResolver resolver = getContentResolver();
                          String rootDocId = DocumentsContract.getTreeDocumentId(treeUri);
                          String backupDirDocId = findChildDocumentId(treeUri, rootDocId, targetSubfolder);
                          String[] searchDirs = backupDirDocId != null ? new String[]{backupDirDocId, rootDocId} : new String[]{rootDocId};
                          for (String dirDocId : searchDirs) {
                              for (String fname : candidateFileNames) {
                                  String fileDocId = findChildDocumentId(treeUri, dirDocId, fname);
                                  if (fileDocId != null) {
                                      Uri fileUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, fileDocId);
                                      cachedSafBackupUriMap.put(mode, fileUri);
                                      return fileUri;
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                      return null;
                  }

                  @JavascriptInterface
                  public long getSafBackupFileSize(String vaultMode) {
                      String mode = (vaultMode != null && !vaultMode.isEmpty()) ? vaultMode : "primary";
                      Uri fileUri = resolveSafBackupFileUri(mode);
                      if (fileUri == null) return -1;
                      ContentResolver resolver = getContentResolver();
                      try (android.content.res.AssetFileDescriptor afd = resolver.openAssetFileDescriptor(fileUri, "r")) {
                          if (afd != null && afd.getLength() > 0) {
                              return afd.getLength();
                          }
                      } catch (Exception ignored) {}
                      try (ParcelFileDescriptor pfd = resolver.openFileDescriptor(fileUri, "r")) {
                          if (pfd != null && pfd.getStatSize() > 0) {
                              return pfd.getStatSize();
                          }
                      } catch (Exception ignored) {}
                      try (Cursor c = resolver.query(fileUri, new String[]{DocumentsContract.Document.COLUMN_SIZE}, null, null, null)) {
                          if (c != null && c.moveToFirst() && !c.isNull(0)) {
                              long size = c.getLong(0);
                              if (size > 0) return size;
                          }
                      } catch (Exception ignored) {}
                      try (InputStream is = resolver.openInputStream(fileUri)) {
                          if (is != null) {
                              long total = 0;
                              byte[] buf = new byte[16384];
                              int r;
                              while ((r = is.read(buf)) != -1) {
                                  total += r;
                              }
                              if (total > 0) return total;
                          }
                      } catch (Exception ignored) {}
                      return -1;
                  }

                  @JavascriptInterface
                  public String readSafBackupSlice(long offset, int length, String vaultMode) {
                      String mode = (vaultMode != null && !vaultMode.isEmpty()) ? vaultMode : "primary";
                      Uri fileUri = resolveSafBackupFileUri(mode);
                      if (fileUri == null) {
                          return "ERROR:FILE_NOT_FOUND";
                      }
                      ContentResolver resolver = getContentResolver();
                      try {
                          // Fast path: ParcelFileDescriptor and FileChannel direct offset position
                          ParcelFileDescriptor pfd = resolver.openFileDescriptor(fileUri, "r");
                          if (pfd != null) {
                              try (FileInputStream fis = new FileInputStream(pfd.getFileDescriptor());
                                   FileChannel channel = fis.getChannel()) {
                                  channel.position(offset);
                                  byte[] buf = new byte[length];
                                  ByteBuffer bb = ByteBuffer.wrap(buf);
                                  int totalRead = 0;
                                  while (bb.hasRemaining()) {
                                      int r = channel.read(bb);
                                      if (r == -1) break;
                                      totalRead += r;
                                  }
                                  if (totalRead <= 0) {
                                      return "ERROR:EOF_REACHED";
                                  }
                                  return Base64.encodeToString(buf, 0, totalRead, Base64.NO_WRAP);
                              } finally {
                                  try { pfd.close(); } catch (Exception ignored) {}
                              }
                          }
                      } catch (Exception e1) {
                          // Fallback: InputStream with robust skip loop
                          try (InputStream is = resolver.openInputStream(fileUri)) {
                              if (is == null) return "ERROR:OPEN_FAILED";
                              long remainingSkip = offset;
                              while (remainingSkip > 0) {
                                  long skipped = is.skip(remainingSkip);
                                  if (skipped <= 0) {
                                      if (is.read() == -1) {
                                          return "ERROR:SKIP_FAILED_EOF";
                                      }
                                      remainingSkip--;
                                  } else {
                                      remainingSkip -= skipped;
                                  }
                              }
                              byte[] buf = new byte[length];
                              int totalRead = 0;
                              while (totalRead < length) {
                                  int r = is.read(buf, totalRead, length - totalRead);
                                  if (r == -1) break;
                                  totalRead += r;
                              }
                              if (totalRead <= 0) {
                                  return "ERROR:READ_FAILED_EOF";
                              }
                              return Base64.encodeToString(buf, 0, totalRead, Base64.NO_WRAP);
                          } catch (Exception e2) {
                              return "ERROR:READ_EXCEPTION:" + e2.getMessage();
                          }
                      }
                      return "ERROR:UNKNOWN";
                  }

