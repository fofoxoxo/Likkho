                  serviceIntent.putExtra("sampleRate", sampleRate);
                  serviceIntent.putExtra("logId", logId != null ? logId : "");
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
