                  @JavascriptInterface
                  public void authenticateBiometric() {
                      runOnUiThread(() -> {
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                  BiometricPrompt.Builder builder = new BiometricPrompt.Builder(MainActivity.this)
                                      .setTitle("Likkho Biometric Unlock")
                                      .setSubtitle("Verify your fingerprint, face, or screen lock");

                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                      builder.setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK | BiometricManager.Authenticators.DEVICE_CREDENTIAL);
                                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                      builder.setDeviceCredentialAllowed(true);
                                  } else {
                                      builder.setNegativeButton("Use Passcode", getMainExecutor(), (d, w) -> notifyBiometricResult(false, "Cancelled"));
                                  }

                                  builder.build().authenticate(
                                      new CancellationSignal(),
                                      getMainExecutor(),
                                      new BiometricPrompt.AuthenticationCallback() {
                                          @Override
                                          public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                                              notifyBiometricResult(true, "");
                                          }

                                          @Override
                                          public void onAuthenticationError(int errorCode, CharSequence errString) {
                                              notifyBiometricResult(false, errString != null ? errString.toString() : "Verification cancelled");
                                          }
                                      }
                                  );
                              } else {
                                  KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                                  if (km != null && km.isKeyguardSecure()) {
                                      Intent authIntent = km.createConfirmDeviceCredentialIntent("Likkho Unlock", "Verify screen lock");
                                      if (authIntent != null) {
                                          startActivityForResult(authIntent, DEVICE_CREDENTIAL_UNLOCK_CODE);
                                          return;
                                      }
                                  }
                                  notifyBiometricResult(true, "");
                              }
                          } catch (Exception e) {
                              notifyBiometricResult(false, e.getMessage());
                          }
                      });
                  }

                  @JavascriptInterface
                  public void authenticateDeviceLockForBackup() {
                      runOnUiThread(() -> {
                          ensureStorageAccessForPersistentHiddenVault();
                          try {
                              KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                              if (km != null && !km.isKeyguardSecure()) {
                                  // No lock screen set on device
                                  notifyDeviceLockBackupResult(true, "");
                                  return;
                              }

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                  BiometricPrompt.Builder builder = new BiometricPrompt.Builder(MainActivity.this)
                                      .setTitle("Verify Device Lock for Likkho Vault")
                                      .setSubtitle("Use Fingerprint, Face, PIN, or Pattern to unlock backup vault");

                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                      builder.setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK | BiometricManager.Authenticators.DEVICE_CREDENTIAL);
                                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                      builder.setDeviceCredentialAllowed(true);
                                  } else {
                                      builder.setNegativeButton("Cancel", getMainExecutor(), (d, w) -> notifyDeviceLockBackupResult(false, "Verification cancelled"));
                                  }

                                  builder.build().authenticate(
                                      new CancellationSignal(),
                                      getMainExecutor(),
                                      new BiometricPrompt.AuthenticationCallback() {
                                          @Override
                                          public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                                              notifyDeviceLockBackupResult(true, "");
                                          }

                                          @Override
                                          public void onAuthenticationError(int errorCode, CharSequence errString) {
                                              // Fallback to Keyguard credential screen if biometric prompt errors
                                              if (km != null && km.isKeyguardSecure()) {
                                                  Intent authIntent = km.createConfirmDeviceCredentialIntent("Likkho Backup Vault", "Verify PIN, Pattern, or Password");
                                                  if (authIntent != null) {
                                                      startActivityForResult(authIntent, DEVICE_CREDENTIAL_BACKUP_CODE);
                                                      return;
                                                  }
                                              }
                                              notifyDeviceLockBackupResult(false, errString != null ? errString.toString() : "Verification cancelled");
                                          }
                                      }
                                  );
                              } else if (km != null && km.isKeyguardSecure()) {
                                  Intent authIntent = km.createConfirmDeviceCredentialIntent("Likkho Backup Vault", "Verify PIN, Pattern, or Password");
                                  if (authIntent != null) {
                                      startActivityForResult(authIntent, DEVICE_CREDENTIAL_BACKUP_CODE);
                                      return;
                                  }
                                  notifyDeviceLockBackupResult(true, "");
                              } else {
                                  notifyDeviceLockBackupResult(true, "");
                              }
                          } catch (Exception e) {
                              notifyDeviceLockBackupResult(true, "");
                          }
                      });
                  }

                  @JavascriptInterface
                  public void scheduleNativeReminder(String logId, String title, String body, long triggerAtMs) {
                      runOnUiThread(() -> {
                          try {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                      ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, NOTIF_PERMISSION_REQUEST_CODE);
                                  }
                              }
                              AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                              if (am == null) return;

                              int reqCode = Math.abs(logId != null ? logId.hashCode() : (int) System.currentTimeMillis());
                              Intent intent = new Intent(MainActivity.this, ReminderReceiver.class);
                              intent.putExtra("title", title);
                              intent.putExtra("body", body);
                              intent.putExtra("notifId", reqCode);

                              PendingIntent pi = PendingIntent.getBroadcast(
                                  MainActivity.this,
                                  reqCode,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  try {
                                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMs, pi);
                                  } catch (SecurityException se) {
                                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMs, pi);
                                  }
                              } else {
                                  am.setExact(AlarmManager.RTC_WAKEUP, triggerAtMs, pi);
                              }
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void cancelNativeReminder(String logId) {
                      runOnUiThread(() -> {
                          try {
                              AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                              if (am == null || logId == null) return;
                              int reqCode = Math.abs(logId.hashCode());
                              Intent intent = new Intent(MainActivity.this, ReminderReceiver.class);
                              PendingIntent pi = PendingIntent.getBroadcast(
                                  MainActivity.this,
                                  reqCode,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              am.cancel(pi);
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public boolean writePersistentVaultBackup(String envelope) {
                      byte[] bytes = envelope.getBytes(StandardCharsets.UTF_8);
                      boolean wroteAny = false;

                      // 1. Write to Hidden Special Folder in Public Downloads: /storage/emulated/0/Download/.likkho_private_vault/ with .nomedia file!
                      String[] targetSubDirs = new String[]{HIDDEN_VAULT_DIR, LEGACY_VAULT_DIR};
                      File[] baseRoots = new File[]{
                          Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                          Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS)
                      };

                      for (File root : baseRoots) {
                          if (root == null) continue;
                          for (String sub : targetSubDirs) {
                              try {
                                  File vaultDir = new File(root, sub);
                                  if (!vaultDir.exists()) vaultDir.mkdirs();
                                  File nomedia = new File(vaultDir, ".nomedia");
                                  if (!nomedia.exists()) nomedia.createNewFile();
                                  File outFile = new File(vaultDir, VAULT_FILENAME);
                                  try (FileOutputStream fos = new FileOutputStream(outFile, false)) {
                                      fos.write(bytes);
                                      fos.flush();
                                      wroteAny = true;
                                  }
                              } catch (Exception ignored) {}
                          }
                      }

                      // 2. Also write via MediaStore into Download/.likkho_private_vault/
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          try {
                              ContentResolver resolver = getContentResolver();
                              Uri collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                              String selection = MediaStore.Downloads.DISPLAY_NAME + " = ?";
                              String[] selectionArgs = new String[]{VAULT_FILENAME};
                              try (Cursor cursor = resolver.query(collection, new String[]{MediaStore.Downloads._ID}, selection, selectionArgs, null)) {
                                  if (cursor != null) {
                                      while (cursor.moveToNext()) {
                                          long id = cursor.getLong(0);
                                          resolver.delete(ContentUris.withAppendedId(collection, id), null, null);
                                      }
                                  }
                              } catch (Exception ignored) {}

                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, VAULT_FILENAME);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/octet-stream");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/" + HIDDEN_VAULT_DIR);
                              Uri uri = resolver.insert(collection, values);
                              if (uri != null) {
                                  try (OutputStream os = resolver.openOutputStream(uri, "wt")) {
                                      if (os != null) {
                                          os.write(bytes);
                                          os.flush();
                                          wroteAny = true;
                                      }
                                  }
                              }
                          } catch (Exception ignored) {}
                      }
                      return wroteAny;
                  }

                  @JavascriptInterface
                  public String readPersistentVaultBackup() {
                      // 1. Check Hidden Special Folder (.likkho_private_vault) AND Legacy Folder (Likkho_Backup) in Downloads & Documents
                      File[] baseRoots = new File[]{
                          Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),
                          Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS)
                      };
                      String[] subDirs = new String[]{HIDDEN_VAULT_DIR, LEGACY_VAULT_DIR, "Likkho/" + HIDDEN_VAULT_DIR};

                      for (File root : baseRoots) {
                          if (root == null) continue;
                          for (String sub : subDirs) {
                              try {
                                  File candidate = new File(new File(root, sub), VAULT_FILENAME);
                                  if (candidate.exists() && candidate.length() > 0) {
                                      try (FileInputStream fis = new FileInputStream(candidate)) {
                                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                                          byte[] buf = new byte[8192];
                                          int r;
                                          while ((r = fis.read(buf)) != -1) {
                                              baos.write(buf, 0, r);
                                          }
                                          String content = new String(baos.toByteArray(), StandardCharsets.UTF_8);
                                          if (!content.trim().isEmpty()) return content;
                                      }
                                  }
                              } catch (Exception ignored) {}
                          }
                      }

                      // 2. Query MediaStore.Downloads AND MediaStore.Files for likkho_encrypted_vault%
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          Uri[] collections = new Uri[]{
                              MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                              MediaStore.Files.getContentUri("external")
                          };
                          ContentResolver resolver = getContentResolver();
                          for (Uri collection : collections) {
                              try {
                                  String selection = MediaStore.MediaColumns.DISPLAY_NAME + " LIKE ?";
                                  String[] selectionArgs = new String[]{"likkho_encrypted_vault%"};
                                  String sortOrder = MediaStore.MediaColumns.DATE_MODIFIED + " DESC";
                                  try (Cursor cursor = resolver.query(collection, new String[]{MediaStore.MediaColumns._ID}, selection, selectionArgs, sortOrder)) {
                                      if (cursor != null && cursor.moveToFirst()) {
                                          long id = cursor.getLong(0);
                                          Uri fileUri = ContentUris.withAppendedId(collection, id);
                                          try (InputStream is = resolver.openInputStream(fileUri)) {
                                              if (is != null) {
                                                  ByteArrayOutputStream baos = new ByteArrayOutputStream();
                                                  byte[] buf = new byte[8192];
                                                  int r;
                                                  while ((r = is.read(buf)) != -1) {
                                                      baos.write(buf, 0, r);
                                                  }
                                                  String content = new String(baos.toByteArray(), StandardCharsets.UTF_8);
                                                  if (!content.trim().isEmpty()) return content;
                                              }
                                          }
                                      }
                                  }
                              } catch (Exception ignored) {}
                          }
                      }
                      return "";
                  }

                  @JavascriptInterface
                  public void pickVaultBackupFile() {
                      runOnUiThread(() -> {
                          try {
                              Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("*/*");
                              startActivityForResult(intent, PICK_VAULT_FILE_CODE);
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void saveExportedFile(String base64Data, String filename, String mimeType) {
                      try {
                          byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                              values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Likkho");
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  OutputStream os = getContentResolver().openOutputStream(uri);
                                  if (os != null) {
                                      os.write(bytes);
                                      os.flush();
                                      os.close();
                                  }
                              }
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              File likkhoDir = new File(dir, "Likkho");
                              if (!likkhoDir.exists()) likkhoDir.mkdirs();
                              File outFile = new File(likkhoDir, filename);
                              FileOutputStream fos = new FileOutputStream(outFile);
                              fos.write(bytes);
                              fos.flush();
                              fos.close();
                          }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to Downloads/Likkho/" + filename, Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Export error: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (filePathCallback != null) {
                          Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  } else if (requestCode == DEVICE_CREDENTIAL_UNLOCK_CODE) {
                      notifyBiometricResult(resultCode == RESULT_OK, "");
                  } else if (requestCode == DEVICE_CREDENTIAL_BACKUP_CODE) {
                      notifyDeviceLockBackupResult(resultCode == RESULT_OK, "");
                  } else if (requestCode == PICK_VAULT_FILE_CODE) {
                      String content = "";
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                          try (InputStream is = getContentResolver().openInputStream(data.getData())) {
                              if (is != null) {
                                  ByteArrayOutputStream baos = new ByteArrayOutputStream();
                                  byte[] buf = new byte[8192];
                                  int r;
                                  while ((r = is.read(buf)) != -1) {
                                      baos.write(buf, 0, r);
                                  }
                                  content = new String(baos.toByteArray(), StandardCharsets.UTF_8);
                              }
                          } catch (Exception ignored) {}
                      }
                      final String finalContent = content;
                      runOnUiThread(() -> {
                          if (bridge != null && bridge.getWebView() != null) {
                              String escaped = finalContent.replace("\\", "\\\\").replace("'", "\\'").replace("\n", "\\n").replace("\r", "");
                              bridge.getWebView().evaluateJavascript(
                                  "if(window.__onLikkhoVaultFilePicked) window.__onLikkhoVaultFilePicked('" + escaped + "');",
                                  null
                              );
                          }
                      });
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == MIC_PERMISSION_REQUEST_CODE) {
                      boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (pendingWebPermissionRequest != null) {
                          if (granted) {
                              pendingWebPermissionRequest.grant(pendingWebPermissionRequest.getResources());
                          } else {
                              pendingWebPermissionRequest.deny();
                          }
                          pendingWebPermissionRequest = null;
                      } else if (granted) {
                          startNativeMicServiceInternal(pendingMicSampleRate);
                      }
                  }
              }
          }
