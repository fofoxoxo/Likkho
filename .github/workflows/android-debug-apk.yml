                          bridge.getWebView().evaluateJavascript(
                              "(function(){ if(window.__onLikkhoNewDiaryAction){ return window.__onLikkhoNewDiaryAction() || 'QUEUED'; } return ''; })()",
                              val -> {
                                  if (val != null && val.contains("QUEUED")) {
                                      pendingNewDiaryLaunch = false;
                                  }
