          rm -f "$PKG_DIR/MainActivity.java"

      - name: Build Android Debug APK (v2.1.4)
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.daemon=false"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

          mkdir -p release-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/likkho-debug-v2.1.4.apk
          else
            echo "::error::FATAL: Debug APK (app-debug.apk) not found."
            exit 1
          fi
          ls -lh release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: likkho-debug-v2.1.4-apk
          path: android/release-apks/likkho-debug-v2.1.4.apk
          retention-days: 30

      - name: Build Android Release APK & Release AAB (v2.1.4)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.build_release == true)
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.daemon=false"
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::FATAL: KEYSTORE_BASE64 secret is missing. Release APK and AAB build cannot proceed without release keystore."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

          mkdir -p release-apks
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/likkho-release-v2.1.4.apk
          else
            echo "::error::FATAL: Signed release APK (app-release.apk) not found. Unsigned APK will not be uploaded."
            exit 1
          fi

          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab release-apks/likkho-release-v2.1.4.aab
          else
            echo "::error::FATAL: Signed release AAB (app-release.aab) not found. Unsigned AAB will not be uploaded."
            exit 1
          fi

          ls -lh release-apks/

