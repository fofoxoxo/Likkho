              private void notifyWebViewShareAvailable() {
                  runOnUiThread(() -> {
                      if (bridge != null && bridge.getWebView() != null && pendingIncomingShareJson != null) {
                          bridge.getWebView().postDelayed(() -> {
                              if (bridge != null && bridge.getWebView() != null && pendingIncomingShareJson != null) {
                                  bridge.getWebView().evaluateJavascript(
                                      "(function(){ if(window.__onLikkhoIncomingShareAvailable){ return window.__onLikkhoIncomingShareAvailable() || 'RECEIVED'; } return ''; })()",
                                      null
                                  );
                              }
                          }, 350);
                      }
                  });
              }

              private void checkPendingQuickNoteDone() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  String noteId = prefs.getString("pending_done_quick_note_id", null);
                  if (noteId != null && !noteId.isEmpty()) {
                      prefs.edit().remove("pending_done_quick_note_id").apply();
                      onQuickNoteMarkedDone(noteId);
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  currentInstance = this;
                  hideRecentsPrivacyShield();
                  applyWindowSystemBarsColor(currentStatusBarHex, currentNavBarHex, currentDarkIconsOnLightBar);
                  applyWindowFullScreenMode(isFullScreenEnabled);
                  if (isAppPasscodeProtected) {
                      dismissActionModeAndClearSelection();
                  }
                  deliverFinishedNativeRecordingIfPossible(this);
                  checkPendingQuickNoteDone();
                  if (pendingQuickNoteLaunch) {
                      notifyWebViewQuickNoteLaunch();
                  }
                  if (pendingNewDiaryLaunch) {
                      notifyWebViewNewDiaryLaunch();
                  }
                  if (pendingIncomingShareJson != null) {
                      notifyWebViewShareAvailable();
                  }
              }

