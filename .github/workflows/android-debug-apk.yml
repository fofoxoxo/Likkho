name: Build Likkho Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools build-tools;34.0.0'

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar @capacitor/local-notifications @capacitor/filesystem
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Likkho" "com.likkho.diary" --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Modern targetSdkVersion 34, SAF (.likkho_backups + .nomedia) & Microphone Foreground Service
        run: |
          # Upgrade to modern compileSdkVersion = 34 & targetSdkVersion = 34 so Google Play Protect and Android 14/15 NEVER show "Unsafe App / Built for older version of Android" warnings!
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' android/variables.gradle || true
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle || true
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "FOREGROUND_SERVICE_MICROPHONE" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" \/>\n    <application android:hardwareAccelerated="true"/' "$MANIFEST"
          fi

          # Ensure MainActivity uses adjustResize for smooth keyboard and toolbar docking
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:windowSoftInputMode="adjustResize"/' "$MANIFEST" || true

          # Register ReminderReceiver and MicForegroundService (foregroundServiceType="microphone", stopWithTask="false") inside <application>
          if ! grep -q "ReminderReceiver" "$MANIFEST"; then
            sed -i 's/<\/application>/    <receiver android:name=".ReminderReceiver" android:exported="false" \/>\n        <service android:name=".MicForegroundService" android:exported="false" android:stopWithTask="false" android:foregroundServiceType="microphone" \/>\n    <\/application>/' "$MANIFEST"
          fi

          # Set Likkho launcher icon (white background with black "Likkho" text) in density-specific mipmap folders only
          for dir in android/app/src/main/res/mipmap-*dpi; do
            if [ -d "$dir" ] && [[ "$dir" != *"anydpi"* ]]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_round.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png || true

          PKG_DIR="android/app/src/main/java/com/likkho/diary"
          mkdir -p "$PKG_DIR"

          # 1. Create ReminderReceiver.java for OS-level scheduled notifications
          cat << 'EOF' > "$PKG_DIR/ReminderReceiver.java"
          package com.likkho.diary;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;

          public class ReminderReceiver extends BroadcastReceiver {
              private static final String CHANNEL_ID = "likkho_reminders_channel";

              @Override
              public void onReceive(Context context, Intent intent) {
                  String title = intent.getStringExtra("title");
                  String body = intent.getStringExtra("body");
                  int notifId = intent.getIntExtra("notifId", (int) System.currentTimeMillis());

                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Likkho Diary Reminders",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.enableVibration(true);
                      Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      channel.setSound(soundUri, null);
                      nm.createNotificationChannel(channel);
                  }

                  Intent openIntent = new Intent(context, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentIntent = PendingIntent.getActivity(
                      context,
                      notifId,
                      openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Uri defaultSound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_popup_reminder)
                      .setContentTitle(title != null ? title : "Likkho Reminder")
                      .setContentText(body != null ? body : "You have a scheduled diary reminder.")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_REMINDER)
                      .setSound(defaultSound)
                      .setAutoCancel(true)
                      .setContentIntent(contentIntent);

                  nm.notify(notifId, builder.build());
              }
          }
          EOF

          # 2. Create MicForegroundService.java:
          #    - Uses Microphone Foreground Service (foregroundServiceType="microphone") with START_STICKY and persistent Notification Bell
          #    - Keeps recording when screen is off, phone is locked, or app is swiped away from Recent Apps WITHOUT requiring "Display over other apps" permission!
          cat << 'EOF' > "$PKG_DIR/MicForegroundService.java"
          package com.likkho.diary;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.MediaRecorder;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import androidx.core.app.NotificationCompat;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.RandomAccessFile;

          public class MicForegroundService extends Service {
              public static final String ACTION_START = "com.likkho.diary.ACTION_START_MIC";
              public static final String ACTION_STOP = "com.likkho.diary.ACTION_STOP_MIC";
              private static final String CHANNEL_ID = "likkho_mic_recording_channel";
              private static final int NOTIF_ID = 8801;

              public static volatile boolean isRecording = false;
              public static volatile long recordingStartedAtMs = 0;
              public static volatile String latestFinishedFilePath = null;
              public static volatile int latestDurationSec = 1;

              private PowerManager.WakeLock wakeLock;
              private AudioRecord audioRecord;
              private Thread recordingThread;
              private int sampleRate = 44100;

              @Override
              public void onCreate() {
                  super.onCreate();
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Likkho::MicRecordingWakeLock");
                      wakeLock.acquire(6 * 60 * 60 * 1000L);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopNativeRecordingAndFinish();
                      return START_NOT_STICKY;
                  }

                  if (intent != null && intent.hasExtra("sampleRate")) {
                      sampleRate = intent.getIntExtra("sampleRate", 44100);
                  }

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Likkho Microphone Recording",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      nm.createNotificationChannel(channel);
                  }

                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pendingOpen = PendingIntent.getActivity(
                      this,
                      0,
                      openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Intent stopIntent = new Intent(this, MicForegroundService.class);
                  stopIntent.setAction(ACTION_STOP);
                  PendingIntent pendingStop = PendingIntent.getService(
                      this,
                      1,
                      stopIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  // Persistent Notification Bell so Android OS never kills the microphone process on screen off / task swipe
                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("Likkho Microphone Active")
                      .setContentText("Recording audio in background. Tap Stop to finish.")
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setCategory(NotificationCompat.CATEGORY_SERVICE)
                      .setContentIntent(pendingOpen)
                      .addAction(android.R.drawable.ic_media_pause, "Stop", pendingStop)
                      .build();

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                  } else {
                      startForeground(NOTIF_ID, notification);
                  }

                  if (!isRecording) {
                      startNativeAudioRecordLoop();
                  }

                  return START_STICKY;
              }

              private void startNativeAudioRecordLoop() {
                  try {
                      int channelConfig = AudioFormat.CHANNEL_IN_MONO;
                      int audioEncoding = AudioFormat.ENCODING_PCM_16BIT;
                      int minBufSize = AudioRecord.getMinBufferSize(sampleRate, channelConfig, audioEncoding);
                      if (minBufSize <= 0) {
                          sampleRate = 44100;
                          minBufSize = AudioRecord.getMinBufferSize(sampleRate, channelConfig, audioEncoding);
                      }
                      final int bufferSize = Math.max(minBufSize * 2, 8192);

                      audioRecord = new AudioRecord(
                          MediaRecorder.AudioSource.MIC,
                          sampleRate,
                          channelConfig,
                          audioEncoding,
                          bufferSize
                      );

                      final File wavFile = new File(getFilesDir(), "likkho_active_mic_recording.wav");
                      isRecording = true;
                      recordingStartedAtMs = System.currentTimeMillis();

                      audioRecord.startRecording();

                      recordingThread = new Thread(() -> {
                          try (FileOutputStream fos = new FileOutputStream(wavFile)) {
                              fos.write(new byte[44]);
                              byte[] buffer = new byte[bufferSize];
                              long totalPcmBytes = 0;

                              while (isRecording) {
                                  int read = audioRecord.read(buffer, 0, buffer.length);
                                  if (read > 0) {
                                      fos.write(buffer, 0, read);
                                      totalPcmBytes += read;
                                  }
                              }
                              fos.flush();
                              writeWavHeader(wavFile, totalPcmBytes, sampleRate, 1, 16);
                              latestFinishedFilePath = wavFile.getAbsolutePath();
                          } catch (Exception ignored) {}
                      }, "LikkhoNativeMicThread");
                      recordingThread.start();
                  } catch (Exception e) {
                      isRecording = false;
                  }
              }

              private void writeWavHeader(File file, long totalAudioLen, long longSampleRate, int channels, int bitsPerSample) {
                  try (RandomAccessFile raf = new RandomAccessFile(file, "rw")) {
                      long totalDataLen = totalAudioLen + 36;
                      long byteRate = longSampleRate * channels * bitsPerSample / 8;
                      byte[] header = new byte[44];
                      header[0] = 'R'; header[1] = 'I'; header[2] = 'F'; header[3] = 'F';
                      header[4] = (byte) (totalDataLen & 0xff);
                      header[5] = (byte) ((totalDataLen >> 8) & 0xff);
                      header[6] = (byte) ((totalDataLen >> 16) & 0xff);
                      header[7] = (byte) ((totalDataLen >> 24) & 0xff);
                      header[8] = 'W'; header[9] = 'A'; header[10] = 'V'; header[11] = 'E';
                      header[12] = 'f'; header[13] = 'm'; header[14] = 't'; header[15] = ' ';
                      header[16] = 16; header[17] = 0; header[18] = 0; header[19] = 0;
                      header[20] = 1; header[21] = 0;
                      header[22] = (byte) channels; header[23] = 0;
                      header[24] = (byte) (longSampleRate & 0xff);
                      header[25] = (byte) ((longSampleRate >> 8) & 0xff);
                      header[26] = (byte) ((longSampleRate >> 16) & 0xff);
                      header[27] = (byte) ((longSampleRate >> 24) & 0xff);
                      header[28] = (byte) (byteRate & 0xff);
                      header[29] = (byte) ((byteRate >> 8) & 0xff);
                      header[30] = (byte) ((byteRate >> 16) & 0xff);
                      header[31] = (byte) ((byteRate >> 24) & 0xff);
                      header[32] = (byte) (channels * bitsPerSample / 8); header[33] = 0;
                      header[34] = (byte) bitsPerSample; header[35] = 0;
                      header[36] = 'd'; header[37] = 'a'; header[38] = 't'; header[39] = 'a';
                      header[40] = (byte) (totalAudioLen & 0xff);
                      header[41] = (byte) ((totalAudioLen >> 8) & 0xff);
                      header[42] = (byte) ((totalAudioLen >> 16) & 0xff);
                      header[43] = (byte) ((totalAudioLen >> 24) & 0xff);
                      raf.seek(0);
                      raf.write(header, 0, 44);
                  } catch (Exception ignored) {}
              }

              public void stopNativeRecordingAndFinish() {
                  if (!isRecording) {
                      stopForeground(true);
                      stopSelf();
                      return;
                  }
                  isRecording = false;
                  latestDurationSec = Math.max(1, (int) ((System.currentTimeMillis() - recordingStartedAtMs) / 1000L));
                  try {
                      if (audioRecord != null) {
                          audioRecord.stop();
                          audioRecord.release();
                          audioRecord = null;
                      }
                  } catch (Exception ignored) {}

                  try {
                      if (recordingThread != null) {
                          recordingThread.join(1500);
                          recordingThread = null;
                      }
                  } catch (Exception ignored) {}

                  MainActivity.deliverFinishedNativeRecordingIfPossible(this);
                  stopForeground(true);
                  stopSelf();
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  // Keep recording active even when Likkho is swiped away from Recent Apps (Task Manager)
                  if (isRecording) {
                      Intent restartServiceIntent = new Intent(getApplicationContext(), this.getClass());
                      restartServiceIntent.setPackage(getPackageName());
                      PendingIntent restartServicePendingIntent = PendingIntent.getService(
                          getApplicationContext(),
                          1,
                          restartServiceIntent,
                          PendingIntent.FLAG_ONE_SHOT | PendingIntent.FLAG_IMMUTABLE
                      );
                      AlarmManager alarmService = (AlarmManager) getApplicationContext().getSystemService(Context.ALARM_SERVICE);
                      if (alarmService != null) {
                          alarmService.set(
                              AlarmManager.ELAPSED_REALTIME,
                              SystemClock.elapsedRealtime() + 400,
                              restartServicePendingIntent
                          );
                      }
                  }
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 3. Configure MainActivity.java:
          #    - Uses SAF (Storage Access Framework) System File Picker (ACTION_OPEN_DOCUMENT_TREE)
          #    - User chooses base directory once (e.g., Documents), inside which Likkho automatically creates
          #      hidden subfolder (.likkho_backups) + .nomedia file + AES-256-GCM encrypted backup file (likkho_encrypted_vault.json)
          #    - Works on modern targetSdkVersion = 34 with zero Play Protect warnings and survives app reinstalls!
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.likkho.diary;

          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.KeyguardManager;
          import android.app.PendingIntent;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.hardware.biometrics.BiometricManager;
          import android.hardware.biometrics.BiometricPrompt;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.os.Environment;
          import android.provider.DocumentsContract;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private static final int MIC_PERMISSION_REQUEST_CODE = 1001;
              private static final int MEDIA_PERMISSION_REQUEST_CODE = 1002;
              private static final int FILE_CHOOSER_RESULT_CODE = 1003;
              private static final int NOTIF_PERMISSION_REQUEST_CODE = 1004;
              private static final int DEVICE_CREDENTIAL_UNLOCK_CODE = 1005;
              private static final int SAF_TREE_PICKER_CODE = 1006;

              private static final String PREFS_NAME = "likkho_saf_prefs";
              private static final String KEY_SAF_TREE_URI = "saf_base_tree_uri";
              private static final String HIDDEN_SUBFOLDER_NAME = ".likkho_backups";
              private static final String VAULT_FILENAME = "likkho_encrypted_vault.json";
              private static final String LEGACY_VAULT_FILENAME = "likkho_encrypted_vault.bak";

              private static final int SAF_OP_NONE = 0;
              private static final int SAF_OP_CHOOSE_ONLY = 1;
              private static final int SAF_OP_BACKUP = 2;
              private static final int SAF_OP_RESTORE = 3;

              public static MainActivity currentInstance;

              private PermissionRequest pendingWebPermissionRequest;
              private ValueCallback<Uri[]> filePathCallback;
              private int pendingMicSampleRate = 44100;
              private CancellationSignal activeBiometricCancelSignal;

              private int pendingSafOperation = SAF_OP_NONE;
              private String pendingBackupEnvelope = null;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  currentInstance = this;

                  requestNotificationPermissionOnStart();

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      final WebView webView = this.bridge.getWebView();
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setDomStorageEnabled(true);
                      webView.getSettings().setAllowFileAccess(true);
                      webView.getSettings().setAllowContentAccess(true);
                      webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      webView.addJavascriptInterface(new LikkhoAndroidBridge(), "LikkhoNative");

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              for (String res : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res)) {
                                      if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                          pendingWebPermissionRequest = request;
                                          ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, MIC_PERMISSION_REQUEST_CODE);
                                          return;
                                      }
                                  }
                              }
                              request.grant(request.getResources());
                          }

                          @Override
                          public boolean onShowFileChooser(WebView vw, ValueCallback<Uri[]> filePathCb, FileChooserParams fileChooserParams) {
                              if (filePathCallback != null) {
                                  filePathCallback.onReceiveValue(null);
                              }
                              filePathCallback = filePathCb;
                              requestMediaPermissionsIfNeeded();
                              try {
                                  Intent intent = fileChooserParams.createIntent();
                                  startActivityForResult(intent, FILE_CHOOSER_RESULT_CODE);
                              } catch (Exception e) {
                                  filePathCallback = null;
                                  return false;
                              }
                              return true;
                          }
                      });
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(
                                  "(function(){ return window.__handleLikkhoAndroidBack ? window.__handleLikkhoAndroidBack() : 'EXIT'; })()",
                                  value -> {
                                      if (value != null && value.contains("HANDLED")) {
                                          // Handled inside Likkho (returned to Homepage first)
                                      } else {
                                          runOnUiThread(() -> {
                                              setEnabled(false);
                                              MainActivity.super.onBackPressed();
                                              setEnabled(true);
                                          });
                                      }
                                  }
                              );
                          } else {
                              setEnabled(false);
                              MainActivity.super.onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });
              }

              @Override
              public void onResume() {
                  super.onResume();
                  currentInstance = this;
                  if (!MicForegroundService.isRecording && MicForegroundService.latestFinishedFilePath != null) {
                      deliverFinishedNativeRecordingIfPossible(this);
                  }
              }

              public static void deliverFinishedNativeRecordingIfPossible(Context ctx) {
                  final String path = MicForegroundService.latestFinishedFilePath;
                  final int duration = MicForegroundService.latestDurationSec;
                  if (path == null || currentInstance == null) return;

                  File f = new File(path);
                  if (!f.exists() || f.length() <= 44) return;

                  try (FileInputStream fis = new FileInputStream(f)) {
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int r;
                      while ((r = fis.read(buf)) != -1) {
                          baos.write(buf, 0, r);
                      }
                      final String b64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                      MicForegroundService.latestFinishedFilePath = null;
                      f.delete();

                      currentInstance.runOnUiThread(() -> {
                          if (currentInstance.bridge != null && currentInstance.bridge.getWebView() != null) {
                              currentInstance.bridge.getWebView().evaluateJavascript(
                                  "if(window.__onLikkhoNativeMicFinished) window.__onLikkhoNativeMicFinished('" + b64 + "', " + duration + ");",
                                  null
                              );
                          }
                      });
                  } catch (Exception ignored) {}
              }

              private void requestNotificationPermissionOnStart() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, NOTIF_PERMISSION_REQUEST_CODE);
                      }
                  }
              }

              private boolean requestMediaPermissionsIfNeeded() {
                  List<String> needed = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_MEDIA_IMAGES);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_MEDIA_AUDIO);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      }
                  }
                  if (!needed.isEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), MEDIA_PERMISSION_REQUEST_CODE);
                      return true;
                  }
                  return false;
              }

              // ==================== SAF (Storage Access Framework) Helpers ====================

              private Uri getPersistedSafTreeUri() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  String uriStr = prefs.getString(KEY_SAF_TREE_URI, null);
                  if (uriStr == null || uriStr.isEmpty()) return null;
                  try {
                      Uri uri = Uri.parse(uriStr);
                      for (android.content.UriPermission perm : getContentResolver().getPersistedUriPermissions()) {
                          if (perm.getUri().equals(uri) && perm.isReadPermission() && perm.isWritePermission()) {
                              return uri;
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private String extractSafFolderDisplayName(Uri treeUri) {
                  if (treeUri == null) return "";
                  try {
                      String docId = DocumentsContract.getTreeDocumentId(treeUri);
                      if (docId != null && docId.contains(":")) {
                          String tail = docId.substring(docId.indexOf(":") + 1);
                          return tail.isEmpty() ? "Internal Storage" : tail;
                      }
                      return docId != null ? docId : "Selected Folder";
                  } catch (Exception e) {
                      return "Selected Folder";
                  }
              }

              private void launchSafDirectoryPicker(int operation) {
                  pendingSafOperation = operation;
                  runOnUiThread(() -> {
                      try {
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                          intent.addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION |
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION |
                              Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION |
                              Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
                          );
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              Uri initialDocsUri = Uri.parse("content://com.android.externalstorage.documents/document/primary%3ADocuments");
                              intent.putExtra(DocumentsContract.EXTRA_INITIAL_URI, initialDocsUri);
                          }
                          startActivityForResult(intent, SAF_TREE_PICKER_CODE);
                      } catch (Exception e) {
                          if (operation == SAF_OP_BACKUP) {
                              notifySafBackupResult(false, "Unable to open folder picker: " + e.getMessage());
                          } else if (operation == SAF_OP_RESTORE) {
                              notifySafRestoreResult(false, "");
                          }
                      }
                  });
              }

              private String findChildDocumentId(Uri treeUri, String parentDocId, String targetDisplayName) {
                  ContentResolver resolver = getContentResolver();
                  Uri childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(treeUri, parentDocId);
                  String[] projection = new String[]{
                      DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                      DocumentsContract.Document.COLUMN_DISPLAY_NAME
                  };
                  try (Cursor c = resolver.query(childrenUri, projection, null, null, null)) {
                      if (c != null) {
                          while (c.moveToNext()) {
                              String docId = c.getString(0);
                              String name = c.getString(1);
                              if (targetDisplayName.equalsIgnoreCase(name)) {
                                  return docId;
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private String getOrCreateChildDirectory(Uri treeUri, String parentDocId, String folderName) throws Exception {
                  // If the user directly selected .likkho_backups itself as the tree root, use parentDocId directly
                  if (parentDocId != null && parentDocId.endsWith("/" + folderName) || (parentDocId != null && parentDocId.endsWith(":" + folderName))) {
                      return parentDocId;
                  }
                  String existingId = findChildDocumentId(treeUri, parentDocId, folderName);
                  if (existingId != null) return existingId;

                  Uri parentDocUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, parentDocId);
                  Uri createdDirUri = DocumentsContract.createDocument(
                      getContentResolver(),
                      parentDocUri,
                      DocumentsContract.Document.MIME_TYPE_DIR,
                      folderName
                  );
                  if (createdDirUri == null) {
                      throw new Exception("Could not create " + folderName + " folder.");
                  }
                  return DocumentsContract.getDocumentId(createdDirUri);
              }

              private void ensureNomediaInSafFolder(Uri treeUri, String backupDirDocId) {
                  try {
                      String existingNomedia = findChildDocumentId(treeUri, backupDirDocId, ".nomedia");
                      if (existingNomedia == null) {
                          Uri backupDirUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, backupDirDocId);
                          DocumentsContract.createDocument(
                              getContentResolver(),
                              backupDirUri,
                              "application/octet-stream",
                              ".nomedia"
                          );
                      }
                  } catch (Exception ignored) {}
              }

              private void performSafBackupWrite(Uri treeUri, String envelope) {
                  new Thread(() -> {
                      try {
                          ContentResolver resolver = getContentResolver();
                          String rootDocId = DocumentsContract.getTreeDocumentId(treeUri);
                          String backupDirDocId = getOrCreateChildDirectory(treeUri, rootDocId, HIDDEN_SUBFOLDER_NAME);
                          ensureNomediaInSafFolder(treeUri, backupDirDocId);

                          String existingFileDocId = findChildDocumentId(treeUri, backupDirDocId, VAULT_FILENAME);
                          Uri targetFileUri;
                          if (existingFileDocId != null) {
                              targetFileUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, existingFileDocId);
                          } else {
                              Uri backupDirUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, backupDirDocId);
                              targetFileUri = DocumentsContract.createDocument(
                                  resolver,
                                  backupDirUri,
                                  "application/json",
                                  VAULT_FILENAME
                              );
                          }

                          if (targetFileUri == null) {
                              notifySafBackupResult(false, "Could not create backup file in selected folder.");
                              return;
                          }

                          byte[] bytes = envelope.getBytes(StandardCharsets.UTF_8);
                          try (OutputStream os = resolver.openOutputStream(targetFileUri, "wt")) {
                              if (os == null) {
                                  notifySafBackupResult(false, "Unable to write to backup file.");
                                  return;
                              }
                              os.write(bytes);
                              os.flush();
                          }

                          notifySafBackupResult(true, "Backup saved in " + extractSafFolderDisplayName(treeUri) + "/" + HIDDEN_SUBFOLDER_NAME);
                      } catch (Exception e) {
                          notifySafBackupResult(false, e.getMessage());
                      }
                  }).start();
              }

              private void performSafRestoreRead(Uri treeUri) {
                  new Thread(() -> {
                      try {
                          ContentResolver resolver = getContentResolver();
                          String rootDocId = DocumentsContract.getTreeDocumentId(treeUri);

                          // Check inside <SelectedFolder>/.likkho_backups/ first, or directly inside <SelectedFolder> if user picked .likkho_backups
                          String backupDirDocId = findChildDocumentId(treeUri, rootDocId, HIDDEN_SUBFOLDER_NAME);
                          String[] searchDirs = backupDirDocId != null
                              ? new String[]{backupDirDocId, rootDocId}
                              : new String[]{rootDocId};
                          String[] candidateFileNames = new String[]{VAULT_FILENAME, LEGACY_VAULT_FILENAME};

                          for (String dirDocId : searchDirs) {
                              for (String fname : candidateFileNames) {
                                  String fileDocId = findChildDocumentId(treeUri, dirDocId, fname);
                                  if (fileDocId != null) {
                                      Uri fileUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, fileDocId);
                                      try (InputStream is = resolver.openInputStream(fileUri)) {
                                          if (is != null) {
                                              ByteArrayOutputStream baos = new ByteArrayOutputStream();
                                              byte[] buf = new byte[8192];
                                              int r;
                                              while ((r = is.read(buf)) != -1) {
                                                  baos.write(buf, 0, r);
                                              }
                                              String content = new String(baos.toByteArray(), StandardCharsets.UTF_8);
                                              if (!content.trim().isEmpty()) {
                                                  notifySafRestoreResult(true, content);
                                                  return;
                                              }
                                          }
                                      }
                                  }
                              }
                          }

                          notifySafRestoreResult(false, "");
                      } catch (Exception e) {
                          notifySafRestoreResult(false, "");
                      }
                  }).start();
              }

              private void notifySafBackupResult(final boolean success, final String msg) {
                  runOnUiThread(() -> {
                      if (bridge != null && bridge.getWebView() != null) {
                          String safeMsg = msg != null ? msg.replace("\\", "\\\\").replace("'", "\\'") : "";
                          bridge.getWebView().evaluateJavascript(
                              "if(window.__onLikkhoSafBackupResult) window.__onLikkhoSafBackupResult(" + success + ", '" + safeMsg + "');",
                              null
                          );
                      }
                  });
              }

              private void notifySafRestoreResult(final boolean success, final String payload) {
                  runOnUiThread(() -> {
                      if (bridge != null && bridge.getWebView() != null) {
                          String b64 = payload != null && !payload.isEmpty()
                              ? Base64.encodeToString(payload.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP)
                              : "";
                          bridge.getWebView().evaluateJavascript(
                              "if(window.__onLikkhoSafRestoreResult) window.__onLikkhoSafRestoreResult(" + success + ", " + (b64.isEmpty() ? "''" : "atob('" + b64 + "')") + ");",
                              null
                          );
                      }
                  });
              }

              private void notifySafFolderSelected(final String folderName) {
                  runOnUiThread(() -> {
                      if (bridge != null && bridge.getWebView() != null) {
                          String safeName = folderName != null ? folderName.replace("'", "\\'") : "";
                          bridge.getWebView().evaluateJavascript(
                              "if(window.__onLikkhoSafFolderSelected) window.__onLikkhoSafFolderSelected('" + safeName + "');",
                              null
                          );
                      }
                  });
              }

              private void notifyBiometricResult(final boolean success, final String msg) {
                  runOnUiThread(() -> {
                      if (bridge != null && bridge.getWebView() != null) {
                          String safeMsg = msg != null ? msg.replace("'", "\\'") : "";
                          bridge.getWebView().evaluateJavascript(
                              "if(window.__onLikkhoBiometricResult) window.__onLikkhoBiometricResult(" + success + ", '" + safeMsg + "');",
                              null
                          );
                      }
                  });
              }

              private void startNativeMicServiceInternal(int sampleRate) {
                  Intent serviceIntent = new Intent(MainActivity.this, MicForegroundService.class);
                  serviceIntent.setAction(MicForegroundService.ACTION_START);
                  serviceIntent.putExtra("sampleRate", sampleRate);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }
              }

              public class LikkhoAndroidBridge {
                  @JavascriptInterface
                  public void requestFilesAndMediaPermission() {
                      runOnUiThread(() -> requestMediaPermissionsIfNeeded());
                  }

                  @JavascriptInterface
                  public void requestMicPermission() {
                      runOnUiThread(() -> {
                          if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, MIC_PERMISSION_REQUEST_CODE);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void startNativeMicRecording(int sampleRate, int bitRate) {
                      pendingMicSampleRate = sampleRate > 0 ? sampleRate : 44100;
                      runOnUiThread(() -> {
                          if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, MIC_PERMISSION_REQUEST_CODE);
                              return;
                          }
                          startNativeMicServiceInternal(pendingMicSampleRate);
                      });
                  }

                  @JavascriptInterface
                  public void stopNativeMicRecording() {
                      runOnUiThread(() -> {
                          Intent stopIntent = new Intent(MainActivity.this, MicForegroundService.class);
                          stopIntent.setAction(MicForegroundService.ACTION_STOP);
                          startService(stopIntent);
                      });
                  }

                  @JavascriptInterface
                  public boolean isNativeMicRecordingActive() {
                      return MicForegroundService.isRecording;
                  }

                  @JavascriptInterface
                  public int getNativeMicRecordingSeconds() {
                      if (!MicForegroundService.isRecording || MicForegroundService.recordingStartedAtMs <= 0) return 0;
                      return Math.max(0, (int) ((System.currentTimeMillis() - MicForegroundService.recordingStartedAtMs) / 1000L));
                  }

                  @JavascriptInterface
                  public void startForegroundMicService() {
                      startNativeMicRecording(44100, 128000);
                  }

                  @JavascriptInterface
                  public void stopForegroundMicService() {
                      stopNativeMicRecording();
                  }

                  @JavascriptInterface
                  public void cancelBiometricPrompt() {
                      runOnUiThread(() -> {
                          try {
                              if (activeBiometricCancelSignal != null && !activeBiometricCancelSignal.isCanceled()) {
                                  activeBiometricCancelSignal.cancel();
                              }
                              activeBiometricCancelSignal = null;
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void authenticateBiometric() {
                      runOnUiThread(() -> {
                          try {
                              if (activeBiometricCancelSignal != null && !activeBiometricCancelSignal.isCanceled()) {
                                  return;
                              }
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                  BiometricPrompt.Builder builder = new BiometricPrompt.Builder(MainActivity.this)
                                      .setTitle("Likkho Biometric Unlock")
                                      .setSubtitle("Touch fingerprint sensor or tap Use Passcode")
                                      .setNegativeButton("Use Passcode", getMainExecutor(), (d, w) -> {
                                          activeBiometricCancelSignal = null;
                                          notifyBiometricResult(false, "Cancelled");
                                      });

                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                      builder.setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK);
                                  }

                                  activeBiometricCancelSignal = new CancellationSignal();
                                  builder.build().authenticate(
                                      activeBiometricCancelSignal,
                                      getMainExecutor(),
                                      new BiometricPrompt.AuthenticationCallback() {
                                          @Override
                                          public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                                              activeBiometricCancelSignal = null;
                                              notifyBiometricResult(true, "");
                                          }

                                          @Override
                                          public void onAuthenticationError(int errorCode, CharSequence errString) {
                                              activeBiometricCancelSignal = null;
                                              notifyBiometricResult(false, errString != null ? errString.toString() : "Verification cancelled");
                                          }
                                      }
                                  );
                              } else {
                                  KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                                  if (km != null && km.isKeyguardSecure()) {
                                      Intent authIntent = km.createConfirmDeviceCredentialIntent("Likkho Unlock", "Verify screen lock");
                                      if (authIntent != null) {
                                          startActivityForResult(authIntent, DEVICE_CREDENTIAL_UNLOCK_CODE);
                                          return;
                                      }
                                  }
                                  notifyBiometricResult(true, "");
                              }
                          } catch (Exception e) {
                              activeBiometricCancelSignal = null;
                              notifyBiometricResult(false, e.getMessage());
                          }
                      });
                  }

                  @JavascriptInterface
                  public void scheduleNativeReminder(String logId, String title, String body, long triggerAtMs) {
                      runOnUiThread(() -> {
                          try {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                      ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, NOTIF_PERMISSION_REQUEST_CODE);
                                  }
                              }
                              AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                              if (am == null) return;

                              int reqCode = Math.abs(logId != null ? logId.hashCode() : (int) System.currentTimeMillis());
                              Intent intent = new Intent(MainActivity.this, ReminderReceiver.class);
                              intent.putExtra("title", title);
                              intent.putExtra("body", body);
                              intent.putExtra("notifId", reqCode);

                              PendingIntent pi = PendingIntent.getBroadcast(
                                  MainActivity.this,
                                  reqCode,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  try {
                                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMs, pi);
                                  } catch (SecurityException se) {
                                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAtMs, pi);
                                  }
                              } else {
                                  am.setExact(AlarmManager.RTC_WAKEUP, triggerAtMs, pi);
                              }
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void cancelNativeReminder(String logId) {
                      runOnUiThread(() -> {
                          try {
                              AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                              if (am == null || logId == null) return;
                              int reqCode = Math.abs(logId.hashCode());
                              Intent intent = new Intent(MainActivity.this, ReminderReceiver.class);
                              PendingIntent pi = PendingIntent.getBroadcast(
                                  MainActivity.this,
                                  reqCode,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                              );
                              am.cancel(pi);
                          } catch (Exception ignored) {}
                      });
                  }

                  /**
                   * SAF (Storage Access Framework) Methods:
                   * - User picks base directory once (e.g. Documents) via Android System File Picker
                   * - Likkho automatically creates hidden subfolder (.likkho_backups) + .nomedia + likkho_encrypted_vault.json
                   */
                  @JavascriptInterface
                  public String getSafBaseFolderName() {
                      Uri treeUri = getPersistedSafTreeUri();
                      return treeUri != null ? extractSafFolderDisplayName(treeUri) : "";
                  }

                  @JavascriptInterface
                  public void chooseSafBaseFolder() {
                      launchSafDirectoryPicker(SAF_OP_CHOOSE_ONLY);
                  }

                  @JavascriptInterface
                  public void saveBackupViaSaf(String envelope) {
                      pendingBackupEnvelope = envelope;
                      Uri treeUri = getPersistedSafTreeUri();
                      if (treeUri != null) {
                          performSafBackupWrite(treeUri, envelope);
                      } else {
                          launchSafDirectoryPicker(SAF_OP_BACKUP);
                      }
                  }

                  @JavascriptInterface
                  public void restoreBackupViaSaf() {
                      Uri treeUri = getPersistedSafTreeUri();
                      if (treeUri != null) {
                          performSafRestoreRead(treeUri);
                      } else {
                          launchSafDirectoryPicker(SAF_OP_RESTORE);
                      }
                  }

                  @JavascriptInterface
                  public void saveExportedFile(String base64Data, String filename, String mimeType) {
                      try {
                          byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                              values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Likkho");
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  OutputStream os = getContentResolver().openOutputStream(uri);
                                  if (os != null) {
                                      os.write(bytes);
                                      os.flush();
                                      os.close();
                                  }
                              }
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              File likkhoDir = new File(dir, "Likkho");
                              if (!likkhoDir.exists()) likkhoDir.mkdirs();
                              File outFile = new File(likkhoDir, filename);
                              FileOutputStream fos = new FileOutputStream(outFile);
                              fos.write(bytes);
                              fos.flush();
                              fos.close();
                          }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to Downloads/Likkho/" + filename, Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Export error: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (filePathCallback != null) {
                          Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  } else if (requestCode == DEVICE_CREDENTIAL_UNLOCK_CODE) {
                      notifyBiometricResult(resultCode == RESULT_OK, "");
                  } else if (requestCode == SAF_TREE_PICKER_CODE) {
                      int op = pendingSafOperation;
                      pendingSafOperation = SAF_OP_NONE;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                          Uri treeUri = data.getData();
                          try {
                              final int takeFlags = Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION;
                              getContentResolver().takePersistableUriPermission(treeUri, takeFlags);
                              getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
                                  .edit()
                                  .putString(KEY_SAF_TREE_URI, treeUri.toString())
                                  .apply();
                          } catch (Exception ignored) {}

                          String folderName = extractSafFolderDisplayName(treeUri);
                          notifySafFolderSelected(folderName);

                          if (op == SAF_OP_BACKUP && pendingBackupEnvelope != null) {
                              String env = pendingBackupEnvelope;
                              pendingBackupEnvelope = null;
                              performSafBackupWrite(treeUri, env);
                          } else if (op == SAF_OP_RESTORE) {
                              performSafRestoreRead(treeUri);
                          }
                      } else {
                          if (op == SAF_OP_BACKUP) {
                              notifySafBackupResult(false, "Folder selection cancelled.");
                          } else if (op == SAF_OP_RESTORE) {
                              notifySafRestoreResult(false, "");
                          }
                      }
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == MIC_PERMISSION_REQUEST_CODE) {
                      boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (pendingWebPermissionRequest != null) {
                          if (granted) {
                              pendingWebPermissionRequest.grant(pendingWebPermissionRequest.getResources());
                          } else {
                              pendingWebPermissionRequest.deny();
                          }
                          pendingWebPermissionRequest = null;
                      } else if (granted) {
                          startNativeMicServiceInternal(pendingMicSampleRate);
                      }
                  }
              }
          }
