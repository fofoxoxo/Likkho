              private void showNativeLaunchOverlay(final String bgHex, final boolean isDark) {
                  try {
                      if (nativeLaunchOverlayView != null || launchOverlayDismissed) return;
                      ViewGroup rootContent = findViewById(android.R.id.content);
                      if (rootContent == null) return;

                      FrameLayout veil = new FrameLayout(this);
                      veil.setBackgroundColor(Color.parseColor(bgHex));
                      veil.setClickable(true);
                      veil.setFocusable(false);

                      LinearLayout centerCol = new LinearLayout(this);
                      centerCol.setOrientation(LinearLayout.VERTICAL);
                      centerCol.setGravity(Gravity.CENTER);

                      TextView wordmark = new TextView(this);
                      wordmark.setText("Likkho");
                      wordmark.setTypeface(Typeface.SERIF, Typeface.BOLD);
                      wordmark.setTextSize(30);
                      wordmark.setTextColor(Color.parseColor(isDark ? "#E6EDF3" : "#000000"));
                      wordmark.setGravity(Gravity.CENTER);

                      TextView subtitle = new TextView(this);
                      subtitle.setText("Personal Knowledge Diary");
                      subtitle.setTextSize(11);
                      subtitle.setTextColor(Color.parseColor(isDark ? "#8B949E" : "#54595D"));
                      subtitle.setGravity(Gravity.CENTER);
                      LinearLayout.LayoutParams subLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      );
                      subLp.topMargin = 10;
                      subtitle.setLayoutParams(subLp);

                      centerCol.addView(wordmark);
                      centerCol.addView(subtitle);

                      FrameLayout.LayoutParams centerLp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                      );
                      veil.addView(centerCol, centerLp);

                      rootContent.addView(
                          veil,
                          new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          )
                      );
                      nativeLaunchOverlayView = veil;

                      new Handler(Looper.getMainLooper()).postDelayed(this::dismissNativeLaunchOverlay, 650);
                  } catch (Exception ignored) {}
              }

              private void dismissNativeLaunchOverlay() {
                  runOnUiThread(() -> {
                      if (launchOverlayDismissed) return;
                      launchOverlayDismissed = true;
                      final View overlay = nativeLaunchOverlayView;
                      if (overlay == null) return;
                      nativeLaunchOverlayView = null;
                      try {
                          overlay.animate()
                              .alpha(0f)
                              .setDuration(140)
                              .withEndAction(() -> {
                                  try {
                                      android.view.ViewParent p = overlay.getParent();
                                      if (p instanceof ViewGroup) {
                                          ((ViewGroup) p).removeView(overlay);
                                      }
                                  } catch (Exception ignored) {}
                              })
                              .start();
                      } catch (Exception e) {
                          try {
                              android.view.ViewParent p = overlay.getParent();
                              if (p instanceof ViewGroup) {
                                  ((ViewGroup) p).removeView(overlay);
                              }
                          } catch (Exception ignored) {}
                      }
                  });
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  // Disable Android System Dark Mode (Night Mode) override at Activity level so Likkho controls its own Light/Dark status & navigation bars
                  androidx.appcompat.app.AppCompatDelegate.setDefaultNightMode(androidx.appcompat.app.AppCompatDelegate.MODE_NIGHT_NO);

                  // Read persisted theme BEFORE super.onCreate so initial window frame matches Light or Dark Mode with zero white flash
                  SharedPreferences earlyPrefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  currentStatusBarHex = earlyPrefs.getString(KEY_STATUS_BAR_HEX, "#f8f9fa");
                  currentNavBarHex = earlyPrefs.getString(KEY_NAV_BAR_HEX, "#ffffff");
                  currentDarkIconsOnLightBar = earlyPrefs.getBoolean(KEY_DARK_ICONS_ON_LIGHT, true);
                  isFullScreenEnabled = earlyPrefs.getBoolean(KEY_FULLSCREEN_ENABLED, false);
                  try {
                      if (getWindow() != null) {
                          getWindow().setBackgroundDrawable(new ColorDrawable(Color.parseColor(currentNavBarHex)));
                      }
                  } catch (Exception ignored) {}

                  super.onCreate(savedInstanceState);
                  currentInstance = this;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q && getWindow() != null) {
                      getWindow().getDecorView().setForceDarkAllowed(false);
                  }

                  // Configure seamless Android OS Status Bar & Navigation Bar colors from the very first frame (no top/bottom mismatched gaps)
                  applyWindowSystemBarsColor(currentStatusBarHex, currentNavBarHex, currentDarkIconsOnLightBar);
                  applyWindowFullScreenMode(isFullScreenEnabled);
                  showNativeLaunchOverlay(currentNavBarHex, !currentDarkIconsOnLightBar);

                  // Restore persisted App Passcode Protection state immediately on launch:
                  // - If Passcode is enabled: sets FLAG_SECURE (blocks screenshots & screen recording on every page + blanks Recent Apps preview) + Android 13+ setRecentsScreenshotEnabled(false)
                  // - If Passcode is NOT enabled: clears FLAG_SECURE so screenshots & screen recording are allowed
                  isAppPasscodeProtected = earlyPrefs.getBoolean(KEY_PASSCODE_PROTECTED, false);
                  applyAppPasscodeProtection(isAppPasscodeProtected);

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      final WebView webView = this.bridge.getWebView();
                      webView.setBackgroundColor(android.graphics.Color.parseColor(currentNavBarHex));
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          webView.setForceDarkAllowed(false);
                          try {
                              webView.getSettings().setForceDark(android.webkit.WebSettings.FORCE_DARK_OFF);
                          } catch (Exception ignored) {}
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          try {
                              webView.getSettings().setAlgorithmicDarkeningAllowed(false);
                          } catch (Exception ignored) {}
                      }
                      webView.setLayerType(android.view.View.LAYER_TYPE_HARDWARE, null);
                      webView.setFocusable(true);
                      webView.setFocusableInTouchMode(true);
                      webView.setHapticFeedbackEnabled(true);
                      webView.setOverScrollMode(View.OVER_SCROLL_IF_CONTENT_SCROLLS);
                      webView.setVerticalScrollBarEnabled(false);
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setDomStorageEnabled(true);
                      webView.getSettings().setAllowFileAccess(true);
                      webView.getSettings().setAllowContentAccess(true);
                      webView.getSettings().setCacheMode(android.webkit.WebSettings.LOAD_DEFAULT);
                      webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      webView.addJavascriptInterface(new LikkhoAndroidBridge(), "LikkhoNative");

                      // Smooth frame-synced Gboard / IME animation for fullscreen mode without toolbar overlap
                      ViewCompat.setWindowInsetsAnimationCallback(
                          webView,
                          new WindowInsetsAnimationCompat.Callback(WindowInsetsAnimationCompat.Callback.DISPATCH_MODE_CONTINUE_ON_SUBTREE) {
                              @NonNull
                              @Override
                              public WindowInsetsCompat onProgress(
                                  @NonNull WindowInsetsCompat insets,
                                  @NonNull List<WindowInsetsAnimationCompat> runningAnimations
                              ) {
                                  if (isFullScreenEnabled) {
                                      int imeBottom = insets.getInsets(WindowInsetsCompat.Type.ime()).bottom;
                                      webView.setPadding(0, 0, 0, Math.max(0, imeBottom));
                                  } else if (webView.getPaddingBottom() != 0) {
                                      webView.setPadding(0, 0, 0, 0);
                                  }
                                  return insets;
                              }

                              @Override
                              public void onEnd(@NonNull WindowInsetsAnimationCompat animation) {
                                  if (!isFullScreenEnabled && webView.getPaddingBottom() != 0) {
                                      webView.setPadding(0, 0, 0, 0);
                                  }
                              }
                          }
                      );

                      // Check if Likkho was launched by tapping a .likkho file or Quick Settings/Shortcut
                      handleIncomingLikkhoIntent(getIntent());
                      handleQuickNoteIntent(getIntent());

                      // Defer notification permission prompt unless user opened directly into Quick Note typing modal
                      if (!pendingQuickNoteLaunch) {
                          webView.postDelayed(this::requestNotificationPermissionOnStart, 900);
                      }

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              for (String res : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res)) {
                                      if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                          pendingWebPermissionRequest = request;
                                          ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, MIC_PERMISSION_REQUEST_CODE);
                                          return;
                                      }
                                  }
                              }
                              request.grant(request.getResources());
                          }

                          @Override
                          public boolean onShowFileChooser(WebView vw, ValueCallback<Uri[]> filePathCb, FileChooserParams fileChooserParams) {
                              if (filePathCallback != null) {
                                  filePathCallback.onReceiveValue(null);
                              }
                              filePathCallback = filePathCb;
                              isSystemFilePickerOpen = true;
                              requestMediaPermissionsIfNeeded();
                              try {
                                  Intent intent = fileChooserParams.createIntent();
                                  startActivityForResult(intent, FILE_CHOOSER_RESULT_CODE);
                              } catch (Exception e) {
                                  isSystemFilePickerOpen = false;
                                  filePathCallback = null;
                                  return false;
                              }
                              return true;
                          }
                      });
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(
                                  "(function(){ return window.__handleLikkhoAndroidBack ? window.__handleLikkhoAndroidBack() : 'EXIT'; })()",
                                  value -> {
                                      if (value != null && value.contains("HANDLED")) {
                                          // Handled inside Likkho (returned to Homepage first)
                                      } else {
                                          runOnUiThread(() -> {
                                              setEnabled(false);
                                              MainActivity.super.onBackPressed();
                                              setEnabled(true);
                                          });
                                      }
                                  }
                              );
                          } else {
                              setEnabled(false);
                              MainActivity.super.onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIncomingLikkhoIntent(intent);
                  handleQuickNoteIntent(intent);
