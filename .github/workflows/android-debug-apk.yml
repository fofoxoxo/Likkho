                  @JavascriptInterface
                  public void triggerHaptic(final String kind) {
                      runOnUiThread(() -> {
                          try {
                              View targetView = (bridge != null && bridge.getWebView() != null)
                                  ? bridge.getWebView()
                                  : getWindow().getDecorView();
                              if (targetView == null) return;
                              int feedbackConstant = HapticFeedbackConstants.CLOCK_TICK;
                              if ("confirm".equals(kind)) {
                                  feedbackConstant = (Build.VERSION.SDK_INT >= 30)
                                      ? HapticFeedbackConstants.CONFIRM
                                      : HapticFeedbackConstants.VIRTUAL_KEY;
                              } else if ("reject".equals(kind)) {
                                  feedbackConstant = (Build.VERSION.SDK_INT >= 30)
                                      ? HapticFeedbackConstants.REJECT
                                      : HapticFeedbackConstants.LONG_PRESS;
                              } else if ("heavy".equals(kind)) {
                                  feedbackConstant = HapticFeedbackConstants.LONG_PRESS;
                              } else if ("tap".equals(kind)) {
                                  feedbackConstant = (Build.VERSION.SDK_INT >= 23)
                                      ? HapticFeedbackConstants.CONTEXT_CLICK
                                      : HapticFeedbackConstants.VIRTUAL_KEY;
                              } else if ("tick".equals(kind)) {
                                  feedbackConstant = HapticFeedbackConstants.CLOCK_TICK;
                              }
                              targetView.performHapticFeedback(feedbackConstant);
                          } catch (Exception ignored) {}
                      });
                  }

