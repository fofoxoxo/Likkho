name: Build Likkho Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools build-tools;34.0.0'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar @capacitor/local-notifications @capacitor/filesystem
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Likkho" "com.likkho.diary" --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Permissions, Launcher Icon & Microphone WebView Bridge
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <application/' "$MANIFEST"
          fi

          # Set Likkho launcher icon (white background with black "Likkho" text)
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_round.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

          # Bridge WebRTC getUserMedia to native Android OS Runtime Microphone Permission popup
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            cat << 'EOF' > "$MAIN_ACT"
          package com.likkho.diary;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final int MIC_PERMISSION_REQUEST_CODE = 1001;
              private PermissionRequest pendingWebPermissionRequest;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              for (String res : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res)) {
                                      if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                          pendingWebPermissionRequest = request;
                                          ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, MIC_PERMISSION_REQUEST_CODE);
                                          return;
                                      }
                                  }
                              }
                              request.grant(request.getResources());
                          }
                      });
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == MIC_PERMISSION_REQUEST_CODE && pendingWebPermissionRequest != null) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          pendingWebPermissionRequest.grant(pendingWebPermissionRequest.getResources());
                      } else {
                          pendingWebPermissionRequest.deny();
                      }
                      pendingWebPermissionRequest = null;
                  }
              }
          }
          EOF
          fi

      - name: Assemble Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Likkho-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Likkho-Debug-APK
          path: android/app/build/outputs/apk/debug/Likkho-debug.apk
          retention-days: 30
