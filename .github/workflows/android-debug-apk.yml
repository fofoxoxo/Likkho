                  @JavascriptInterface
                  public void shareLikkhoDiaryArchive(String base64Data, String filename, String shareMessage) {
                      isSystemFilePickerOpen = true;
                      runOnUiThread(() -> {
                          try {
                              byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                              String safeFilename = (filename != null && !filename.trim().isEmpty()) ? filename.trim() : "Diary.likkho";
                              if (!safeFilename.toLowerCase().endsWith(".likkho")) {
                                  safeFilename = safeFilename + ".likkho";
                              }
                              File sharedDir = new File(getCacheDir(), "shared_likkho");
                              if (!sharedDir.exists()) sharedDir.mkdirs();
                              File outFile = new File(sharedDir, safeFilename);
                              try (FileOutputStream fos = new FileOutputStream(outFile)) {
                                  fos.write(bytes);
                                  fos.flush();
                              }

                              Uri contentUri = androidx.core.content.FileProvider.getUriForFile(
                                  MainActivity.this,
                                  getPackageName() + ".fileprovider",
                                  outFile,
                                  safeFilename
                              );

                              if (shareMessage != null && !shareMessage.isEmpty()) {
                                  try {
                                      android.content.ClipboardManager cm = (android.content.ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                                      if (cm != null) {
                                          cm.setPrimaryClip(android.content.ClipData.newPlainText("Likkho Share Message", shareMessage));
                                      }
                                  } catch (Exception ignored) {}
                              }

                              Intent shareIntent = new Intent(Intent.ACTION_SEND);
                              shareIntent.setType("application/x-likkho");
                              shareIntent.putExtra(Intent.EXTRA_STREAM, contentUri);
                              if (shareMessage != null && !shareMessage.isEmpty()) {
                                  shareIntent.putExtra(Intent.EXTRA_TEXT, shareMessage);
                                  shareIntent.putExtra("sms_body", shareMessage);
                              }
                              shareIntent.putExtra(Intent.EXTRA_TITLE, safeFilename);
                              shareIntent.putExtra(Intent.EXTRA_SUBJECT, safeFilename);
                              android.content.ClipData clipData = new android.content.ClipData(
                                  safeFilename,
                                  new String[]{"application/x-likkho", "text/plain"},
                                  new android.content.ClipData.Item(shareMessage != null ? shareMessage : "", null, contentUri)
                              );
                              shareIntent.setClipData(clipData);
                              shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);

                              Intent chooser = Intent.createChooser(shareIntent, "Share Likkho Diary (.likkho)");
                              chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              startActivity(chooser);

                              if (bridge != null && bridge.getWebView() != null) {
                                  bridge.getWebView().postDelayed(() -> isSystemFilePickerOpen = false, 3000);
                              } else {
                                  isSystemFilePickerOpen = false;
                              }
                          } catch (Exception e) {
                              isSystemFilePickerOpen = false;
                              Toast.makeText(MainActivity.this, "Share error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }

