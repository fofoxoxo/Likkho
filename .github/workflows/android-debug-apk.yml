              public static void deliverFinishedNativeRecordingIfPossible(Context ctx) {
                  if (ctx == null) return;
                  SharedPreferences prefs = ctx.getSharedPreferences("likkho_recording_prefs", MODE_PRIVATE);
                  String path = prefs.getString("pending_recording_path", null);
                  int duration = prefs.getInt("pending_recording_duration", 1);
                  String logId = prefs.getString("pending_recording_log_id", "");
                  if (path == null) {
                      path = MicForegroundService.latestFinishedFilePath;
                      duration = MicForegroundService.latestDurationSec;
                      logId = MicForegroundService.currentRecordingLogId != null ? MicForegroundService.currentRecordingLogId : "";
                  }
                  if (path == null) return;

                  final File f = new File(path);
                  if (!f.exists() || f.length() <= 44) return;

                  if (currentInstance == null || currentInstance.bridge == null || currentInstance.bridge.getWebView() == null) {
                      return;
                  }

                  File permFile = f;
                  try {
                      File audioDir = new File(ctx.getFilesDir(), "likkho_audio");
                      if (!audioDir.exists()) audioDir.mkdirs();
                      if (f.getParentFile() == null || !f.getParentFile().equals(audioDir)) {
                          File dest = new File(audioDir, "audio_" + System.currentTimeMillis() + ".wav");
                          if (f.renameTo(dest)) {
                              permFile = dest;
                          }
                      }
                  } catch (Exception ignored) {}

                  final String permanentPath = permFile.getAbsolutePath();
                  final String audioUri = "http://localhost/_capacitor_file_" + permanentPath;
                  final int finalDuration = duration;
                  final String finalLogId = logId != null ? logId : "";

                  currentInstance.runOnUiThread(() -> {
                      if (currentInstance != null && currentInstance.bridge != null && currentInstance.bridge.getWebView() != null) {
                          String safeUri = audioUri.replace("'", "\\'");
                          String safePath = permanentPath.replace("'", "\\'");
                          String safeLogId = finalLogId.replace("'", "\\'");
                          currentInstance.bridge.getWebView().evaluateJavascript(
                              "(function(){ if(window.__onLikkhoNativeAudioFileReady){ window.__onLikkhoNativeAudioFileReady('" + safeUri + "', '" + safePath + "', " + finalDuration + ", '" + safeLogId + "'); return 'OK'; } else if(window.__onLikkhoGlobalNativeMicFinished){ window.__onLikkhoGlobalNativeMicFinished('" + safeUri + "', " + finalDuration + ", '" + safeLogId + "'); return 'OK'; } return 'WAIT'; })()",
                              val -> {
                                  if (val != null && val.contains("OK")) {
                                      clearPendingRecordingStorage(ctx);
                                  }
                              }
                          );
                      }
                  });
              }

              public static void clearPendingRecordingStorage(Context ctx) {
                  if (ctx != null) {
                      try {
                          ctx.getSharedPreferences("likkho_recording_prefs", MODE_PRIVATE)
                              .edit()
                              .clear()
                              .apply();
                      } catch (Exception ignored) {}
                  }
                  MicForegroundService.latestFinishedFilePath = null;
              }

              private void requestNotificationPermissionOnStart() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, NOTIF_PERMISSION_REQUEST_CODE);
                      }
                  }
              }

              private boolean requestMediaPermissionsIfNeeded() {
                  List<String> needed = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_MEDIA_IMAGES);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_MEDIA_AUDIO);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      }
                  }
                  if (!needed.isEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), MEDIA_PERMISSION_REQUEST_CODE);
                      return true;
                  }
                  return false;
              }

