name: Build Likkho Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools build-tools;34.0.0'

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar @capacitor/local-notifications @capacitor/filesystem
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Likkho" "com.likkho.diary" --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Permissions, Hidden .nomedia Vault, Biometric/Device-Lock Backup, Reminders & Unkillable Native Mic Service
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "MANAGE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" \/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" \/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" \/>\n    <application android:requestLegacyExternalStorage="true"/' "$MANIFEST"
          fi

          # Register ReminderReceiver and MicForegroundService inside <application>
          if ! grep -q "ReminderReceiver" "$MANIFEST"; then
            sed -i 's/<\/application>/    <receiver android:name=".ReminderReceiver" android:exported="false" \/>\n        <service android:name=".MicForegroundService" android:exported="false" android:stopWithTask="false" android:foregroundServiceType="microphone" \/>\n    <\/application>/' "$MANIFEST"
          fi

          # Set Likkho launcher icon (white background with black "Likkho" text) in density-specific mipmap folders only
          for dir in android/app/src/main/res/mipmap-*dpi; do
            if [ -d "$dir" ] && [[ "$dir" != *"anydpi"* ]]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_round.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png || true

          PKG_DIR="android/app/src/main/java/com/likkho/diary"
          mkdir -p "$PKG_DIR"

          # 1. Create ReminderReceiver.java for OS-level scheduled notifications
          cat << 'EOF' > "$PKG_DIR/ReminderReceiver.java"
          package com.likkho.diary;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;

          public class ReminderReceiver extends BroadcastReceiver {
              private static final String CHANNEL_ID = "likkho_reminders_channel";

              @Override
              public void onReceive(Context context, Intent intent) {
                  String title = intent.getStringExtra("title");
                  String body = intent.getStringExtra("body");
                  int notifId = intent.getIntExtra("notifId", (int) System.currentTimeMillis());

                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Likkho Diary Reminders",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.enableVibration(true);
                      Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      channel.setSound(soundUri, null);
                      nm.createNotificationChannel(channel);
                  }

                  Intent openIntent = new Intent(context, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentIntent = PendingIntent.getActivity(
                      context,
                      notifId,
                      openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Uri defaultSound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_popup_reminder)
                      .setContentTitle(title != null ? title : "Likkho Reminder")
                      .setContentText(body != null ? body : "You have a scheduled diary reminder.")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_REMINDER)
                      .setSound(defaultSound)
                      .setAutoCancel(true)
                      .setContentIntent(contentIntent);

                  nm.notify(notifId, builder.build());
              }
          }
          EOF

          # 2. Create MicForegroundService.java:
          #    - Records audio directly in the Android Foreground Service using native AudioRecord (NOT inside WebView!)
          #    - Even if the user swipes Likkho away from Recent Apps (destroying MainActivity/WebView), this Service + floating overlay window stays 100% alive and keeps recording until the user stops it!
          cat << 'EOF' > "$PKG_DIR/MicForegroundService.java"
          package com.likkho.diary;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.MediaRecorder;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.TextView;
          import androidx.core.app.NotificationCompat;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.RandomAccessFile;

          public class MicForegroundService extends Service {
              public static final String ACTION_START = "com.likkho.diary.ACTION_START_MIC";
              public static final String ACTION_STOP = "com.likkho.diary.ACTION_STOP_MIC";
              private static final String CHANNEL_ID = "likkho_mic_recording_channel";
              private static final int NOTIF_ID = 8801;

              public static volatile boolean isRecording = false;
              public static volatile long recordingStartedAtMs = 0;
              public static volatile String latestFinishedFilePath = null;
              public static volatile int latestDurationSec = 1;

              private PowerManager.WakeLock wakeLock;
              private AudioRecord audioRecord;
              private Thread recordingThread;
              private WindowManager windowManager;
              private TextView overlayBadgeView;
              private int sampleRate = 44100;

              @Override
              public void onCreate() {
                  super.onCreate();
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Likkho::MicRecordingWakeLock");
                      wakeLock.acquire(6 * 60 * 60 * 1000L);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopNativeRecordingAndFinish();
                      return START_NOT_STICKY;
                  }

                  if (intent != null && intent.hasExtra("sampleRate")) {
                      sampleRate = intent.getIntExtra("sampleRate", 44100);
                  }

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Likkho Voice Recording",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      nm.createNotificationChannel(channel);
                  }

                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pendingOpen = PendingIntent.getActivity(
                      this,
                      0,
                      openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Intent stopIntent = new Intent(this, MicForegroundService.class);
                  stopIntent.setAction(ACTION_STOP);
                  PendingIntent pendingStop = PendingIntent.getService(
                      this,
                      1,
                      stopIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("Likkho Microphone Recording")
                      .setContentText("Recording continues even if app is closed. Tap Stop when done.")
                      .setOngoing(true)
                      .setContentIntent(pendingOpen)
                      .addAction(android.R.drawable.ic_media_pause, "Stop & Save", pendingStop)
                      .build();

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                  } else {
                      startForeground(NOTIF_ID, notification);
                  }

                  showFloatingOverlayBadge();
                  if (!isRecording) {
                      startNativeAudioRecordLoop();
                  }

                  return START_STICKY;
              }

              private void showFloatingOverlayBadge() {
                  if (overlayBadgeView != null) return;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      return;
                  }
                  try {
                      windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                      if (windowManager == null) return;

                      overlayBadgeView = new TextView(this);
                      overlayBadgeView.setText("● REC (Likkho - Tap to Stop)");
                      overlayBadgeView.setTextColor(Color.WHITE);
                      overlayBadgeView.setTextSize(11f);
                      overlayBadgeView.setBackgroundColor(Color.parseColor("#CCb32424"));
                      overlayBadgeView.setPadding(24, 12, 24, 12);
                      overlayBadgeView.setOnClickListener(v -> stopNativeRecordingAndFinish());

                      int layoutType = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;

                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                          PixelFormat.TRANSLUCENT
                      );
                      params.gravity = Gravity.TOP | Gravity.END;
                      params.x = 24;
                      params.y = 120;

                      windowManager.addView(overlayBadgeView, params);
                  } catch (Exception ignored) {
                      overlayBadgeView = null;
                  }
              }

              private void removeFloatingOverlayBadge() {
                  if (windowManager != null && overlayBadgeView != null) {
                      try {
                          windowManager.removeView(overlayBadgeView);
                      } catch (Exception ignored) {}
                      overlayBadgeView = null;
                  }
              }

              private void startNativeAudioRecordLoop() {
                  try {
                      int channelConfig = AudioFormat.CHANNEL_IN_MONO;
                      int audioEncoding = AudioFormat.ENCODING_PCM_16BIT;
                      int minBufSize = AudioRecord.getMinBufferSize(sampleRate, channelConfig, audioEncoding);
                      if (minBufSize <= 0) {
                          sampleRate = 44100;
                          minBufSize = AudioRecord.getMinBufferSize(sampleRate, channelConfig, audioEncoding);
                      }
                      final int bufferSize = Math.max(minBufSize * 2, 8192);

                      audioRecord = new AudioRecord(
                          MediaRecorder.AudioSource.MIC,
                          sampleRate,
                          channelConfig,
                          audioEncoding,
                          bufferSize
                      );

                      final File wavFile = new File(getFilesDir(), "likkho_active_mic_recording.wav");
                      isRecording = true;
                      recordingStartedAtMs = System.currentTimeMillis();

                      audioRecord.startRecording();

                      recordingThread = new Thread(() -> {
                          try (FileOutputStream fos = new FileOutputStream(wavFile)) {
                              // Write 44-byte placeholder header
                              fos.write(new byte[44]);
                              byte[] buffer = new byte[bufferSize];
                              long totalPcmBytes = 0;

                              while (isRecording) {
                                  int read = audioRecord.read(buffer, 0, buffer.length);
                                  if (read > 0) {
                                      fos.write(buffer, 0, read);
                                      totalPcmBytes += read;
                                  }
                              }
                              fos.flush();
                              writeWavHeader(wavFile, totalPcmBytes, sampleRate, 1, 16);
                              latestFinishedFilePath = wavFile.getAbsolutePath();
                          } catch (Exception ignored) {}
                      }, "LikkhoNativeMicThread");
                      recordingThread.start();
                  } catch (Exception e) {
                      isRecording = false;
                  }
              }

              private void writeWavHeader(File file, long totalAudioLen, long longSampleRate, int channels, int bitsPerSample) {
                  try (RandomAccessFile raf = new RandomAccessFile(file, "rw")) {
                      long totalDataLen = totalAudioLen + 36;
                      long byteRate = longSampleRate * channels * bitsPerSample / 8;
                      byte[] header = new byte[44];
                      header[0] = 'R'; header[1] = 'I'; header[2] = 'F'; header[3] = 'F';
                      header[4] = (byte) (totalDataLen & 0xff);
                      header[5] = (byte) ((totalDataLen >> 8) & 0xff);
                      header[6] = (byte) ((totalDataLen >> 16) & 0xff);
                      header[7] = (byte) ((totalDataLen >> 24) & 0xff);
                      header[8] = 'W'; header[9] = 'A'; header[10] = 'V'; header[11] = 'E';
                      header[12] = 'f'; header[13] = 'm'; header[14] = 't'; header[15] = ' ';
                      header[16] = 16; header[17] = 0; header[18] = 0; header[19] = 0;
                      header[20] = 1; header[21] = 0;
                      header[22] = (byte) channels; header[23] = 0;
                      header[24] = (byte) (longSampleRate & 0xff);
                      header[25] = (byte) ((longSampleRate >> 8) & 0xff);
                      header[26] = (byte) ((longSampleRate >> 16) & 0xff);
                      header[27] = (byte) ((longSampleRate >> 24) & 0xff);
                      header[28] = (byte) (byteRate & 0xff);
                      header[29] = (byte) ((byteRate >> 8) & 0xff);
                      header[30] = (byte) ((byteRate >> 16) & 0xff);
                      header[31] = (byte) ((byteRate >> 24) & 0xff);
                      header[32] = (byte) (channels * bitsPerSample / 8); header[33] = 0;
                      header[34] = (byte) bitsPerSample; header[35] = 0;
                      header[36] = 'd'; header[37] = 'a'; header[38] = 't'; header[39] = 'a';
                      header[40] = (byte) (totalAudioLen & 0xff);
                      header[41] = (byte) ((totalAudioLen >> 8) & 0xff);
                      header[42] = (byte) ((totalAudioLen >> 16) & 0xff);
                      header[43] = (byte) ((totalAudioLen >> 24) & 0xff);
                      raf.seek(0);
                      raf.write(header, 0, 44);
                  } catch (Exception ignored) {}
              }

              public void stopNativeRecordingAndFinish() {
                  if (!isRecording) {
                      removeFloatingOverlayBadge();
                      stopForeground(true);
                      stopSelf();
                      return;
                  }
                  isRecording = false;
                  latestDurationSec = Math.max(1, (int) ((System.currentTimeMillis() - recordingStartedAtMs) / 1000L));
                  try {
                      if (audioRecord != null) {
                          audioRecord.stop();
                          audioRecord.release();
                          audioRecord = null;
                      }
                  } catch (Exception ignored) {}

                  try {
                      if (recordingThread != null) {
                          recordingThread.join(1500);
                          recordingThread = null;
                      }
                  } catch (Exception ignored) {}

                  removeFloatingOverlayBadge();
                  MainActivity.deliverFinishedNativeRecordingIfPossible(this);
                  stopForeground(true);
                  stopSelf();
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  // Do NOT stop recording when user clears Likkho from Recent Apps!
                  // If OEM tries to kill service on swipe, schedule immediate restart continuation
                  if (isRecording) {
                      Intent restartServiceIntent = new Intent(getApplicationContext(), this.getClass());
                      restartServiceIntent.setPackage(getPackageName());
                      PendingIntent restartServicePendingIntent = PendingIntent.getService(
                          getApplicationContext(),
                          1,
                          restartServiceIntent,
                          PendingIntent.FLAG_ONE_SHOT | PendingIntent.FLAG_IMMUTABLE
                      );
                      AlarmManager alarmService = (AlarmManager) getApplicationContext().getSystemService(Context.ALARM_SERVICE);
                      if (alarmService != null) {
                          alarmService.set(
                              AlarmManager.ELAPSED_REALTIME,
                              SystemClock.elapsedRealtime() + 500,
                              restartServicePendingIntent
                          );
                      }
                  }
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onDestroy() {
                  removeFloatingOverlayBadge();
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 3. Configure MainActivity.java with:
          #    - Hidden Special Folder (.likkho_private_vault with .nomedia) + All Files Access / Storage fallback so Restore ALWAYS finds the backup after reinstall
          #    - Biometric / Device Lock (PIN, Pattern, or Fingerprint) Binding for Backup & Restore
          #    - Display Over Other Apps (SYSTEM_ALERT_WINDOW) permission + Service-hosted AudioRecord Mic Recording
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.likkho.diary;

          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.KeyguardManager;
          import android.app.PendingIntent;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.hardware.biometrics.BiometricManager;
          import android.hardware.biometrics.BiometricPrompt;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private static final int MIC_PERMISSION_REQUEST_CODE = 1001;
              private static final int MEDIA_PERMISSION_REQUEST_CODE = 1002;
              private static final int FILE_CHOOSER_RESULT_CODE = 1003;
              private static final int NOTIF_PERMISSION_REQUEST_CODE = 1004;
              private static final int DEVICE_CREDENTIAL_UNLOCK_CODE = 1005;
              private static final int DEVICE_CREDENTIAL_BACKUP_CODE = 1006;
              private static final int PICK_VAULT_FILE_CODE = 1007;

              private static final String HIDDEN_VAULT_DIR = ".likkho_private_vault";
              private static final String LEGACY_VAULT_DIR = "Likkho_Backup";
              private static final String VAULT_FILENAME = "likkho_encrypted_vault.bak";

              public static MainActivity currentInstance;

              private PermissionRequest pendingWebPermissionRequest;
              private ValueCallback<Uri[]> filePathCallback;
              private int pendingMicSampleRate = 44100;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  currentInstance = this;

                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, NOTIF_PERMISSION_REQUEST_CODE);
                      }
                  }

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      final WebView webView = this.bridge.getWebView();
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setDomStorageEnabled(true);
                      webView.getSettings().setAllowFileAccess(true);
                      webView.getSettings().setAllowContentAccess(true);
                      webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      webView.addJavascriptInterface(new LikkhoAndroidBridge(), "LikkhoNative");

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              for (String res : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res)) {
                                      if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                          pendingWebPermissionRequest = request;
                                          ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, MIC_PERMISSION_REQUEST_CODE);
                                          return;
                                      }
                                  }
                              }
                              request.grant(request.getResources());
                          }

                          @Override
                          public boolean onShowFileChooser(WebView vw, ValueCallback<Uri[]> filePathCb, FileChooserParams fileChooserParams) {
                              if (filePathCallback != null) {
                                  filePathCallback.onReceiveValue(null);
                              }
                              filePathCallback = filePathCb;
                              requestMediaPermissionsIfNeeded();
                              try {
                                  Intent intent = fileChooserParams.createIntent();
                                  startActivityForResult(intent, FILE_CHOOSER_RESULT_CODE);
                              } catch (Exception e) {
                                  filePathCallback = null;
                                  return false;
                              }
                              return true;
                          }
                      });
                  }

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (bridge != null && bridge.getWebView() != null) {
                              bridge.getWebView().evaluateJavascript(
                                  "(function(){ return window.__handleLikkhoAndroidBack ? window.__handleLikkhoAndroidBack() : 'EXIT'; })()",
                                  value -> {
                                      if (value != null && value.contains("HANDLED")) {
                                          // Handled inside Likkho (returned to Homepage first)
                                      } else {
                                          runOnUiThread(() -> {
                                              setEnabled(false);
                                              MainActivity.super.onBackPressed();
                                              setEnabled(true);
                                          });
                                      }
                                  }
                              );
                          } else {
                              setEnabled(false);
                              MainActivity.super.onBackPressed();
                              setEnabled(true);
                          }
                      }
                  });
              }

              @Override
              public void onResume() {
                  super.onResume();
                  currentInstance = this;
                  // If a native mic recording finished while app was closed/swiped, deliver it now
                  if (!MicForegroundService.isRecording && MicForegroundService.latestFinishedFilePath != null) {
                      deliverFinishedNativeRecordingIfPossible(this);
                  }
              }

              public static void deliverFinishedNativeRecordingIfPossible(Context ctx) {
                  final String path = MicForegroundService.latestFinishedFilePath;
                  final int duration = MicForegroundService.latestDurationSec;
                  if (path == null || currentInstance == null) return;

                  File f = new File(path);
                  if (!f.exists() || f.length() <= 44) return;

                  try (FileInputStream fis = new FileInputStream(f)) {
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int r;
                      while ((r = fis.read(buf)) != -1) {
                          baos.write(buf, 0, r);
                      }
                      final String b64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                      MicForegroundService.latestFinishedFilePath = null;
                      f.delete();

                      currentInstance.runOnUiThread(() -> {
                          if (currentInstance.bridge != null && currentInstance.bridge.getWebView() != null) {
                              currentInstance.bridge.getWebView().evaluateJavascript(
                                  "if(window.__onLikkhoNativeMicFinished) window.__onLikkhoNativeMicFinished('" + b64 + "', " + duration + ");",
                                  null
                              );
                          }
                      });
                  } catch (Exception ignored) {}
              }

              private boolean requestMediaPermissionsIfNeeded() {
                  List<String> needed = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_MEDIA_IMAGES);
                      }
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_MEDIA_AUDIO);
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      }
                  }
                  if (!needed.isEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), MEDIA_PERMISSION_REQUEST_CODE);
                      return true;
                  }
                  return false;
              }

              private void ensureStorageAccessForPersistentHiddenVault() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                              intent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                              Toast.makeText(this, "Please allow All Files Access so Likkho can access its hidden .nomedia backup folder across reinstalls.", Toast.LENGTH_LONG).show();
                          } catch (Exception e) {
                              try {
                                  Intent intent = new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                                  startActivity(intent);
                              } catch (Exception ignored) {}
                          }
                      }
                  } else {
                      requestMediaPermissionsIfNeeded();
                  }
              }

              private void notifyBiometricResult(final boolean success, final String msg) {
                  runOnUiThread(() -> {
                      if (bridge != null && bridge.getWebView() != null) {
                          String safeMsg = msg != null ? msg.replace("'", "\\'") : "";
                          bridge.getWebView().evaluateJavascript(
                              "if(window.__onLikkhoBiometricResult) window.__onLikkhoBiometricResult(" + success + ", '" + safeMsg + "');",
                              null
                          );
                      }
                  });
              }

              private void notifyDeviceLockBackupResult(final boolean success, final String msg) {
                  runOnUiThread(() -> {
                      if (bridge != null && bridge.getWebView() != null) {
                          String safeMsg = msg != null ? msg.replace("'", "\\'") : "";
                          bridge.getWebView().evaluateJavascript(
                              "if(window.__onLikkhoDeviceLockBackupResult) window.__onLikkhoDeviceLockBackupResult(" + success + ", '" + safeMsg + "');",
                              null
                          );
                      }
                  });
              }

              private void startNativeMicServiceInternal(int sampleRate) {
                  // Prompt Display Over Other Apps permission once if not granted so user gets floating stop badge and OEM never kills background mic service
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      try {
                          Intent overlayIntent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(overlayIntent);
                          Toast.makeText(this, "Allow 'Display over other apps' so recording stays active even when swiped from Recent Apps.", Toast.LENGTH_LONG).show();
                      } catch (Exception ignored) {}
                  }

                  Intent serviceIntent = new Intent(MainActivity.this, MicForegroundService.class);
                  serviceIntent.setAction(MicForegroundService.ACTION_START);
                  serviceIntent.putExtra("sampleRate", sampleRate);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }
              }

