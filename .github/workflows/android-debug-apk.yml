name: Build & Release Likkho Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build & publish signed Release APK/AAB (only when releasing a version)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-35 build-tools;35.0.0 build-tools;34.0.0'

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          VITE_GITHUB_REPOSITORY="${{ github.repository }}" npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar @capacitor/local-notifications @capacitor/filesystem
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Likkho" "com.likkho.diary" --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure compileSdk 35, targetSdk 34, SAF (.likkho_backups + .nomedia) & Microphone Foreground Service
        run: |
          # 0. Fix Gradle distribution download timeouts & socket limits:
          #    - Switch -all.zip (~220MB) to -bin.zip (~110MB) to cut download size in half
          #    - Set connection & socket timeout to 180,000 ms (3 minutes) instead of default 10,000 ms (10 seconds)
          #    - Pre-download via curl with multi-retry & GitHub mirror, and point wrapper to local file:/// to eliminate network timeouts
          WRAPPER_PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROPS" ]; then
            sed -i 's/-all\.zip/-bin\.zip/g' "$WRAPPER_PROPS"
            echo "systemProp.org.gradle.internal.http.connectionTimeout=180000" >> "$WRAPPER_PROPS"
            echo "systemProp.org.gradle.internal.http.socketTimeout=180000" >> "$WRAPPER_PROPS"
            echo "systemProp.org.gradle.internal.http.connectionTimeout=180000" >> android/gradle.properties
            echo "systemProp.org.gradle.internal.http.socketTimeout=180000" >> android/gradle.properties

            DIST_URL=$(grep "distributionUrl=" "$WRAPPER_PROPS" | head -n 1 | cut -d'=' -f2- | sed 's/\\:/:/g')
            if [ -n "$DIST_URL" ]; then
              DIST_NAME=$(basename "$DIST_URL")
              echo "Pre-fetching Gradle distribution via curl: $DIST_URL"
              curl -fSL --retry 5 --retry-delay 5 --retry-connrefused --connect-timeout 60 --max-time 300 "$DIST_URL" -o "/tmp/$DIST_NAME" || true
              if [ ! -s "/tmp/$DIST_NAME" ]; then
                VERSION=$(echo "$DIST_NAME" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')
                echo "services.gradle.org slow or timed out, trying GitHub mirror for v${VERSION}..."
                curl -fSL --retry 3 --connect-timeout 30 --max-time 180 "https://github.com/gradle/gradle-distributions/releases/download/v${VERSION}/${DIST_NAME}" -o "/tmp/$DIST_NAME" || true
              fi
              if [ -s "/tmp/$DIST_NAME" ]; then
                echo "Successfully cached /tmp/$DIST_NAME ($(du -h "/tmp/$DIST_NAME" | cut -f1)). Setting distributionUrl to local file."
                sed -i "s|distributionUrl=.*|distributionUrl=file\:///tmp/$DIST_NAME|g" "$WRAPPER_PROPS"
              fi
            fi
          fi

          # Set compileSdkVersion = 35 (required by androidx.core:core-ktx:1.15.0) while keeping targetSdkVersion = 34 and minSdkVersion untouched
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9][0-9]*/compileSdkVersion = 35/g' android/variables.gradle || true
            sed -i 's/targetSdkVersion = [0-9][0-9]*/targetSdkVersion = 34/g' android/variables.gradle || true
          fi
          # Copy Kotlin DSL app/build.gradle.kts (release signingConfig + Kotlin/Compose dependencies) into android/app/build.gradle.kts
          cp app/build.gradle.kts android/app/build.gradle.kts
          rm -f android/app/build.gradle

          # Register Kotlin & Compose Compiler Gradle plugins in Capacitor's generated root android/build.gradle
          node - << 'JSEOF'
            const fs = require("fs");
            const p = "android/build.gradle";
            if (fs.existsSync(p)) {
              let text = fs.readFileSync(p, "utf8");
              if (!text.includes("kotlin-gradle-plugin")) {
                const ktLines =
                  '        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"\n' +
                  '        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21"\n';
                const agpRegex = /(classpath\s+['"]com\.android\.tools\.build:gradle:[^'"]+['"].*\n)/;
                if (agpRegex.test(text)) {
                  text = text.replace(agpRegex, "$1" + ktLines);
                } else if (text.includes("dependencies {")) {
                  text = text.replace("dependencies {", "dependencies {\n" + ktLines);
                }
                fs.writeFileSync(p, text, "utf8");
                console.log("Patched android/build.gradle with Kotlin 2.0.21 + Compose plugins");
              }
            }
          JSEOF

          # Copy repo-tracked native Kotlin/Java sources (app/src/main/java/*) into generated android/app/src/main/java/
          if [ -d "app/src/main/java" ]; then
            mkdir -p android/app/src/main/java
            cp -r app/src/main/java/* android/app/src/main/java/
          fi

          # Copy repo-tracked native Android resources (app/src/main/res/* including bundled Cormorant Garamond fonts) into android/app/src/main/res/
          if [ -d "app/src/main/res" ]; then
            mkdir -p android/app/src/main/res
            cp -r app/src/main/res/* android/app/src/main/res/
          fi

          # Ensure ProGuard rules keep Capacitor Bridge, WebView JavascriptInterface, Kotlin Compose classes, and Likkho native classes when isMinifyEnabled = true
          cat << 'EOF' >> android/app/proguard-rules.pro
          -keep class com.likkho.diary.** { *; }
          -keep class com.getcapacitor.** { *; }
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepattributes JavascriptInterface,Annotation,*Annotation*,Signature,InnerClasses,EnclosingMethod
          -dontwarn com.google.android.gms.**
          -dontwarn org.apache.cordova.**
          -dontwarn kotlin.**
          -dontwarn kotlinx.**
          EOF

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "FOREGROUND_SERVICE_MICROPHONE" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" \/>\n    <application android:hardwareAccelerated="true"/' "$MANIFEST"
          fi

          # Ensure NativeMainActivity is the launcher Activity with adjustResize for smooth keyboard and toolbar docking, and registers custom intent filters for opening .likkho diary archives
          sed -i 's/android:name="\.MainActivity"/android:name=".nativeapp.NativeMainActivity" android:windowSoftInputMode="adjustResize"/' "$MANIFEST" || true
          sed -i 's/android:name="com\.likkho\.diary\.MainActivity"/android:name="com.likkho.diary.nativeapp.NativeMainActivity" android:windowSoftInputMode="adjustResize"/' "$MANIFEST" || true

          if ! grep -q "pathSuffix=\"\.likkho\"" "$MANIFEST"; then
            sed -i 's/<\/activity>/    <intent-filter>\n                <action android:name="android.intent.action.VIEW" \/>\n                <action android:name="android.intent.action.EDIT" \/>\n                <category android:name="android.intent.category.DEFAULT" \/>\n                <category android:name="android.intent.category.BROWSABLE" \/>\n                <data android:scheme="content" \/>\n                <data android:scheme="file" \/>\n                <data android:mimeType="*\/*" \/>\n                <data android:host="*" \/>\n                <data android:pathSuffix=".likkho" \/>\n                <data android:pathPattern=".*\\.likkho" \/>\n                <data android:pathPattern=".*\\..*\\.likkho" \/>\n                <data android:pathPattern=".*\\..*\\..*\\.likkho" \/>\n                <data android:pathPattern=".*\\..*\\..*\\..*\\.likkho" \/>\n            <\/intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" \/>\n                <action android:name="android.intent.action.EDIT" \/>\n                <category android:name="android.intent.category.DEFAULT" \/>\n                <category android:name="android.intent.category.BROWSABLE" \/>\n                <data android:scheme="content" \/>\n                <data android:scheme="file" \/>\n                <data android:mimeType="application\/x-likkho" \/>\n                <data android:mimeType="application\/vnd.likkho.diary" \/>\n            <\/intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" \/>\n                <category android:name="android.intent.category.DEFAULT" \/>\n                <category android:name="android.intent.category.BROWSABLE" \/>\n                <data android:scheme="content" \/>\n                <data android:scheme="file" \/>\n                <data android:mimeType="application\/x-likkho" \/>\n                <data android:mimeType="application\/octet-stream" \/>\n                <data android:mimeType="application\/zip" \/>\n                <data android:mimeType="application\/vnd.likkho.diary" \/>\n                <data android:pathSuffix=".likkho" \/>\n                <data android:pathPattern=".*\\.likkho" \/>\n            <\/intent-filter>\n        <\/activity>/' "$MANIFEST"
          fi

          if ! grep -q "android.intent.action.SEND" "$MANIFEST"; then
            sed -i 's/<\/activity>/    <intent-filter>\n                <action android:name="android.intent.action.SEND" \/>\n                <category android:name="android.intent.category.DEFAULT" \/>\n                <data android:mimeType="text\/plain" \/>\n                <data android:mimeType="image\/*" \/>\n            <\/intent-filter>\n        <\/activity>/' "$MANIFEST"
          fi

          if ! grep -q "android.app.shortcuts" "$MANIFEST"; then
            sed -i 's/<\/activity>/    <meta-data android:name="android.app.shortcuts" android:resource="@xml\/shortcuts" \/>\n        <\/activity>/' "$MANIFEST"
          fi

          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values android/app/src/main/res/layout android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/values/likkho_strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="quick_note_short_label">Quick Note</string>
              <string name="quick_note_long_label">Create Quick Note</string>
              <string name="new_diary_short_label">New Diary</string>
              <string name="new_diary_long_label">Write New Diary</string>
              <string name="widget_description">Latest Quick Note &amp; one-tap Diary / Quick Note capture</string>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/shortcuts.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut
                  android:shortcutId="quick_note"
                  android:enabled="true"
                  android:icon="@android:drawable/ic_menu_edit"
                  android:shortcutShortLabel="@string/quick_note_short_label"
                  android:shortcutLongLabel="@string/quick_note_long_label">
                  <intent
                      android:action="com.likkho.diary.ACTION_QUICK_NOTE"
                      android:targetPackage="com.likkho.diary"
                      android:targetClass="com.likkho.diary.nativeapp.NativeMainActivity" />
              </shortcut>
              <shortcut
                  android:shortcutId="new_diary"
                  android:enabled="true"
                  android:icon="@android:drawable/ic_input_add"
                  android:shortcutShortLabel="@string/new_diary_short_label"
                  android:shortcutLongLabel="@string/new_diary_long_label">
                  <intent
                      android:action="com.likkho.diary.ACTION_NEW_DIARY"
                      android:targetPackage="com.likkho.diary"
                      android:targetClass="com.likkho.diary.nativeapp.NativeMainActivity" />
              </shortcut>
          </shortcuts>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/likkho_widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" />
              <stroke android:width="1dp" android:color="#A2A9B1" />
              <corners android:radius="4dp" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/likkho_widget_btn_primary.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#3366CC" />
              <corners android:radius="3dp" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/likkho_widget_btn_secondary.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F8F9FA" />
              <stroke android:width="1dp" android:color="#A2A9B1" />
              <corners android:radius="3dp" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/layout/likkho_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/likkho_widget_bg"
              android:orientation="vertical"
              android:padding="12dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:fontFamily="serif"
                          android:text="Likkho"
                          android:textColor="#000000"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Quick Capture"
                          android:textColor="#54595D"
                          android:textSize="10sp" />
                  </LinearLayout>

                  <TextView
                      android:id="@+id/widget_btn_new_diary"
                      android:layout_width="wrap_content"
                      android:layout_height="30dp"
                      android:layout_marginEnd="6dp"
                      android:background="@drawable/likkho_widget_btn_secondary"
                      android:gravity="center"
                      android:paddingStart="10dp"
                      android:paddingEnd="10dp"
                      android:text="+ Diary"
                      android:textColor="#202122"
                      android:textSize="11sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/widget_btn_quick_note"
                      android:layout_width="wrap_content"
                      android:layout_height="30dp"
                      android:background="@drawable/likkho_widget_btn_primary"
                      android:gravity="center"
                      android:paddingStart="10dp"
                      android:paddingEnd="10dp"
                      android:text="+ Quick Note"
                      android:textColor="#FFFFFF"
                      android:textSize="11sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="1dp"
                  android:layout_marginTop="8dp"
                  android:layout_marginBottom="8dp"
                  android:background="#EAECF0" />

              <TextView
                  android:id="@+id/widget_note_title"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:ellipsize="end"
                  android:maxLines="1"
                  android:text="No active quick note"
                  android:textColor="#000000"
                  android:textSize="13sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/widget_note_body"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:ellipsize="end"
                  android:maxLines="2"
                  android:text="Tap + Quick Note to pin a note here &amp; notification"
                  android:textColor="#54595D"
                  android:textSize="11sp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/likkho_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/widget_description"
              android:initialLayout="@layout/likkho_widget_layout"
              android:minHeight="110dp"
              android:minResizeHeight="80dp"
              android:minResizeWidth="180dp"
              android:minWidth="250dp"
              android:resizeMode="horizontal|vertical"
              android:targetCellHeight="2"
              android:targetCellWidth="4"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen" />
          EOF

          if [ -f android/app/src/main/res/xml/file_paths.xml ]; then
            if ! grep -q "likkho_shared_cache" android/app/src/main/res/xml/file_paths.xml; then
              sed -i 's/<\/paths>/    <cache-path name="likkho_shared_cache" path="." \/>\n<\/paths>/' android/app/src/main/res/xml/file_paths.xml || true
            fi
          fi

          # Disable Android System Force-Dark on Status Bar, Navigation Bar & Window when System Dark Mode is ON while Likkho is in Light Mode, and allow ShortEdges cutout for Full Screen mode
          rm -rf android/app/src/main/res/values-night android/app/src/main/res/values-night-v* || true
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#3366cc</item>
                  <item name="colorPrimaryDark">#f8f9fa</item>
                  <item name="colorAccent">#3366cc</item>
                  <item name="android:windowBackground">#ffffff</item>
                  <item name="android:statusBarColor">#f8f9fa</item>
                  <item name="android:navigationBarColor">#ffffff</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:windowTranslucentStatus">false</item>
                  <item name="android:windowTranslucentNavigation">false</item>
                  <item name="android:windowLightStatusBar" tools:targetApi="m">true</item>
                  <item name="android:windowLightNavigationBar" tools:targetApi="o_mr1">true</item>
                  <item name="android:enforceStatusBarContrast" tools:targetApi="q">false</item>
                  <item name="android:enforceNavigationBarContrast" tools:targetApi="q">false</item>
                  <item name="android:forceDarkAllowed" tools:targetApi="q">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode" tools:targetApi="p">shortEdges</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">#ffffff</item>
              </style>
          </resources>
          EOF

          # Register ReminderReceiver, QuickNoteReceiver, AudioControlReceiver, LikkhoWidgetProvider, MicForegroundService and QuickNoteTileService inside <application>
          if ! grep -q "LikkhoWidgetProvider" "$MANIFEST"; then
            sed -i 's/<\/application>/    <receiver android:name=".ReminderReceiver" android:exported="false" \/>\n        <receiver android:name=".QuickNoteReceiver" android:exported="false" \/>\n        <receiver android:name=".AudioControlReceiver" android:exported="false" \/>\n        <receiver android:name=".LikkhoWidgetProvider" android:exported="true" android:label="Likkho Quick Note \&amp; Diary">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" \/>\n            <\/intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml\/likkho_widget_info" \/>\n        <\/receiver>\n        <service android:name=".MicForegroundService" android:exported="false" android:stopWithTask="false" android:foregroundServiceType="microphone" \/>\n        <service android:name=".QuickNoteTileService" android:label="Quick Note" android:icon="@android:drawable\/ic_menu_edit" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE" android:exported="true">\n            <intent-filter>\n                <action android:name="android.service.quicksettings.action.QS_TILE" \/>\n            <\/intent-filter>\n        <\/service>\n    <\/application>/' "$MANIFEST"
          fi

          # Set Likkho launcher icon (white background with black "Likkho" text) in density-specific mipmap folders only
          for dir in android/app/src/main/res/mipmap-*dpi; do
            if [ -d "$dir" ] && [[ "$dir" != *"anydpi"* ]]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_round.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png || true

          PKG_DIR="android/app/src/main/java/com/likkho/diary"
          mkdir -p "$PKG_DIR"

          # 1. Create ReminderReceiver.java for OS-level scheduled notifications
          cat << 'EOF' > "$PKG_DIR/ReminderReceiver.java"
          package com.likkho.diary;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import com.likkho.diary.nativeapp.NativeMainActivity;

          public class ReminderReceiver extends BroadcastReceiver {
              private static final String CHANNEL_ID = "likkho_reminders_channel";

              @Override
              public void onReceive(Context context, Intent intent) {
                  String title = intent.getStringExtra("title");
                  String body = intent.getStringExtra("body");
                  int notifId = intent.getIntExtra("notifId", (int) System.currentTimeMillis());

                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Likkho Diary Reminders",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.enableVibration(true);
                      Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      channel.setSound(soundUri, null);
                      nm.createNotificationChannel(channel);
                  }

                  Intent openIntent = new Intent(context, NativeMainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentIntent = PendingIntent.getActivity(
                      context,
                      notifId,
                      openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Uri defaultSound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_popup_reminder)
                      .setContentTitle(title != null ? title : "Likkho Reminder")
                      .setContentText(body != null ? body : "You have a scheduled diary reminder.")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_REMINDER)
                      .setSound(defaultSound)
                      .setAutoCancel(true)
                      .setContentIntent(contentIntent);

                  nm.notify(notifId, builder.build());
              }
          }
          EOF

          # 1b. Create QuickNoteReceiver.java for Notification Shade actions (Done & Dismiss)
          cat << 'EOF' > "$PKG_DIR/QuickNoteReceiver.java"
          package com.likkho.diary;

          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import com.likkho.diary.nativeapp.NativeMainActivity;

          public class QuickNoteReceiver extends BroadcastReceiver {
              public static final String ACTION_DONE = "com.likkho.diary.ACTION_QUICK_NOTE_DONE";
              public static final String ACTION_DISMISS = "com.likkho.diary.ACTION_QUICK_NOTE_DISMISS";

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  String noteId = intent.getStringExtra("noteId");
                  int notifId = intent.getIntExtra("notifId", 88000);

                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) {
                      nm.cancel(notifId);
                  }

                  if (ACTION_DONE.equals(action) && noteId != null && !noteId.isEmpty()) {
                      if (NativeMainActivity.currentInstance != null) {
                          NativeMainActivity.currentInstance.onQuickNoteMarkedDone(noteId);
                      } else {
                          SharedPreferences prefs = context.getSharedPreferences("likkho_saf_prefs", Context.MODE_PRIVATE);
                          prefs.edit().putString("pending_done_quick_note_id", noteId).apply();
                      }
                  }
              }
          }
