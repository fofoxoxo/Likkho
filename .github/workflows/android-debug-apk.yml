name: Build & Sign Likkho Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Signed & Debug Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Web Dependencies & Build Production Bundle
        run: |
          npm install
          npm run build

      - name: Install & Initialize Capacitor Android Shell
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar @capacitor/local-notifications @capacitor/filesystem
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Likkho" "com.likkho.diary" --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Edge-to-Edge Status & Navigation Bar Sync + Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <application/' "$MANIFEST"
          fi

      - name: Generate Android Keystore & Build Signed APK + Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease

          # Generate a personal release keystore so the APK is signed and ready to install on any Android phone
          keytool -genkey -v -keystore likkho-release-key.keystore \
            -alias likkho-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass likkho123456 -keypass likkho123456 \
            -dname "CN=Likkho, OU=Diary, O=Likkho, L=India, S=IN, C=IN"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/Likkho-signed-release.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks likkho-release-key.keystore \
            --ks-key-alias likkho-key \
            --ks-pass pass:likkho123456 \
            --key-pass pass:likkho123456 \
            app/build/outputs/apk/release/Likkho-signed-release.apk

          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Likkho-debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Likkho-Signed-APK
          path: android/app/build/outputs/apk/release/Likkho-signed-release.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Likkho-Debug-APK
          path: android/app/build/outputs/apk/debug/Likkho-debug.apk
          retention-days: 30
