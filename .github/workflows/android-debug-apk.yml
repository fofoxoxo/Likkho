              public void toggleNativeAudioFromNotification() {
                  runOnUiThread(() -> {
                      try {
                          if (nativeMediaPlayer == null || activeAudioId == null) return;
                          if (nativeMediaPlayer.isPlaying()) {
                              nativeMediaPlayer.pause();
                              audioProgressHandler.removeCallbacks(audioProgressRunnable);
                              int posMs = nativeMediaPlayer.getCurrentPosition();
                              int durMs = nativeMediaPlayer.getDuration();
                              emitNativeAudioProgress(activeAudioId, posMs / 1000.0, Math.max(0, durMs) / 1000.0, false, false);
                              updateNativeAudioNotification(activeAudioTitle, false);
                          } else {
                              applySpeedToPlayer(nativeMediaPlayer, activeAudioSpeed);
                              nativeMediaPlayer.start();
                              audioProgressHandler.removeCallbacks(audioProgressRunnable);
                              audioProgressHandler.post(audioProgressRunnable);
                              updateNativeAudioNotification(activeAudioTitle, true);
                          }
                      } catch (Exception ignored) {}
                  });
              }

              public void stopNativeAudioPlayback(final String onlyIfAudioId) {
                  runOnUiThread(() -> {
                      if (onlyIfAudioId != null && activeAudioId != null && !onlyIfAudioId.equals(activeAudioId)) {
                          return;
                      }
                      audioProgressHandler.removeCallbacks(audioProgressRunnable);
                      String prevId = activeAudioId;
                      activeAudioId = null;
                      if (nativeMediaPlayer != null) {
                          try {
                              if (nativeMediaPlayer.isPlaying()) nativeMediaPlayer.stop();
                          } catch (Exception ignored) {}
                          try {
                              nativeMediaPlayer.release();
                          } catch (Exception ignored) {}
                          nativeMediaPlayer = null;
                      }
                      cancelNativeAudioNotification();
                      if (prevId != null) {
                          emitNativeAudioProgress(prevId, 0, 0, false, true);
                      }
                  });
              }

              private void startNativeAudioPlaybackInternal(final String audioId, final String title, final String filePathOrUrl, final float rate, final int startMs) {
                  try {
                      stopNativeAudioPlayback(null);
                      activeAudioId = audioId;
                      activeAudioTitle = (title != null && !title.isEmpty()) ? title : "Likkho Audio";
                      activeAudioSpeed = Math.max(0.5f, Math.min(2.5f, rate > 0 ? rate : 1.0f));

                      final MediaPlayer mp = new MediaPlayer();
                      mp.setAudioAttributes(
                          new AudioAttributes.Builder()
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .build()
                      );
                      if (filePathOrUrl.startsWith("/")) {
                          mp.setDataSource(filePathOrUrl);
                      } else {
                          mp.setDataSource(MainActivity.this, Uri.parse(filePathOrUrl));
                      }
                      mp.setOnPreparedListener(preparedPlayer -> {
                          try {
                              if (startMs > 0 && startMs < preparedPlayer.getDuration()) {
                                  preparedPlayer.seekTo(startMs);
                              }
                              applySpeedToPlayer(preparedPlayer, activeAudioSpeed);
                              preparedPlayer.start();
                              audioProgressHandler.removeCallbacks(audioProgressRunnable);
                              audioProgressHandler.post(audioProgressRunnable);
                              updateNativeAudioNotification(activeAudioTitle, true);
                          } catch (Exception ignored) {}
                      });
                      mp.setOnCompletionListener(completedPlayer -> {
                          stopNativeAudioPlayback(audioId);
                      });
                      mp.setOnErrorListener((errPlayer, what, extra) -> {
                          stopNativeAudioPlayback(audioId);
                          return true;
                      });
                      nativeMediaPlayer = mp;
                      mp.prepareAsync();
                  } catch (Exception e) {
                      stopNativeAudioPlayback(audioId);
                  }
              }

