                  @JavascriptInterface
                  public String getPendingFinishedNativeRecording() {
                      SharedPreferences prefs = getSharedPreferences("likkho_recording_prefs", MODE_PRIVATE);
                      String path = prefs.getString("pending_recording_path", null);
                      if (path == null) return "";
                      File f = new File(path);
                      if (!f.exists() || f.length() <= 44) return "";
                      int duration = prefs.getInt("pending_recording_duration", 1);
                      String logId = prefs.getString("pending_recording_log_id", "");
                      String uri = "http://localhost/_capacitor_file_" + f.getAbsolutePath();
                      String safePath = f.getAbsolutePath().replace("\\", "\\\\").replace("\"", "\\\"");
                      String safeLog = (logId != null ? logId : "").replace("\"", "\\\"");
                      return "{\"audioUri\":\"" + uri + "\",\"filePath\":\"" + safePath + "\",\"duration\":" + duration + ",\"logId\":\"" + safeLog + "\"}";
                  }

                  @JavascriptInterface
                  public String getNativeAudioFileUri(String filePath) {
