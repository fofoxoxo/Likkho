              private void showRecentsPrivacyShield() {
                  runOnUiThread(() -> {
                      try {
                          android.view.Window window = getWindow();
                          if (window == null) return;
                          android.view.View decor = window.getDecorView();
                          if (!(decor instanceof android.view.ViewGroup)) return;
                          android.view.ViewGroup rootGroup = (android.view.ViewGroup) decor;
                          if (recentsPrivacyOverlayView == null) {
                              recentsPrivacyOverlayView = new android.view.View(MainActivity.this);
                              recentsPrivacyOverlayView.setBackgroundColor(android.graphics.Color.BLACK);
                              recentsPrivacyOverlayView.setLayoutParams(new android.view.ViewGroup.LayoutParams(
                                  android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                                  android.view.ViewGroup.LayoutParams.MATCH_PARENT
                              ));
                          }
                          if (recentsPrivacyOverlayView.getParent() == null) {
                              rootGroup.addView(recentsPrivacyOverlayView);
                          }
                          recentsPrivacyOverlayView.setVisibility(android.view.View.VISIBLE);
                          recentsPrivacyOverlayView.bringToFront();
                      } catch (Exception ignored) {}
                  });
              }

              private void hideRecentsPrivacyShield() {
                  runOnUiThread(() -> {
