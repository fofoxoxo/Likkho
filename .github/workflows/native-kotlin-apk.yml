name: Build Likkho Pure Native Android APK (Kotlin & Jetpack Compose)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-apk:
    name: Build Pure Native Kotlin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-35 build-tools;35.0.0 build-tools;34.0.0'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compile and Package Pure Native Kotlin APKs
        working-directory: ./android-native-app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-apks

          # 1. Always assemble Debug APK
          gradle assembleDebug --stacktrace
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*debug*.apk" 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release-apks/likkho-native-kotlin-debug-v1.3.0.apk
            echo "Successfully packaged: release-apks/likkho-native-kotlin-debug-v1.3.0.apk"
          fi

          # 2. Assemble Signed Release APK
          if [ -n "${KEYSTORE_BASE64}" ]; then
            gradle assembleRelease --stacktrace
            RELEASE_APK=$(find app/build/outputs/apk/release -name "*release*.apk" 2>/dev/null | head -n 1)
            if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
              cp "$RELEASE_APK" release-apks/likkho-native-kotlin-release-v1.3.0.apk
              echo "Successfully packaged: release-apks/likkho-native-kotlin-release-v1.3.0.apk"
            fi
          else
            echo "KEYSTORE_BASE64 not configured. Skipping release keystore signing."
          fi

          ls -la release-apks/

      - name: Upload Native Kotlin Release APK
        uses: actions/upload-artifact@v4
        with:
          name: likkho-native-kotlin-release-v1.3.0-apk
          path: android-native-app/release-apks/likkho-native-kotlin-release-v1.3.0.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Native Kotlin Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: likkho-native-kotlin-debug-v1.3.0-apk
          path: android-native-app/release-apks/likkho-native-kotlin-debug-v1.3.0.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish Native Kotlin APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.0
          name: "Likkho v1.3.0 (Minor Update) - Encrypted Dedicated Storage & Backed-up Diaries Vault"
          files: |
            android-native-app/release-apks/likkho-native-kotlin-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
