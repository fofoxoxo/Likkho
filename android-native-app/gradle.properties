# Project-wide Gradle settings for Likkho Native Android App

# AndroidX package structure
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Specifies the JVM arguments used for the daemon process.
# Setting this to 2048m speeds up Jetpack Compose & Room KSP compilation.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official

# Enables namespacing for each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies
android.nonTransitiveRClass=true
